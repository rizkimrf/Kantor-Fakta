<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Poppins;font-weight:100 900;src:url("../../aset/font/Poppins-Bold.ttf")}
body{margin:0;background:#000}.f{position:relative;width:1080px;height:1920px;overflow:hidden}.a{position:absolute}
.judul{position:absolute;left:30px;right:30px;top:250px;text-align:center;font:900 132px/1.0 Poppins,sans-serif;color:#fff;letter-spacing:-3px;-webkit-text-stroke:14px #14182a;paint-order:stroke fill;text-shadow:0 10px 0 rgba(0,0,0,.35)}
.judul .k{font-size:104px}
</style>
<script src="../../studio-aset/tebe-rig.js"></script>
<script src="../../studio-aset/aset-set.js"></script></head><body><div id="o"></div>
<script>
const P=ASET.PALET.siang, M=ASET.PALET.malam, S=ASET.PALET.senja;
const tebe=(p,w,css='')=>`<div class="a" style="${css}width:${w}px">${tebeRigSVG(p).replace('width="400" height="520"','width="100%" height="auto"')}</div>`;
const vignette=`<div class="a" style="inset:0;background:radial-gradient(ellipse at 55% 55%,rgba(0,0,0,0) 45%,rgba(0,0,0,.7) 100%)"></div>`;
const S1=()=>{ // KOMODO: malam, sarang, telur raksasa retak + bayi komodo, Tebe mengintip dengan senter
 const bayi=`<g><path d="M-70 -40 Q-10 -150 80 -110 Q150 -80 120 -30 Q60 -20 0 -10 Z" fill="#7D8A5E" stroke="#3E4630" stroke-width="10"/><circle cx="62" cy="-92" r="16" fill="#fff" stroke="#3E4630" stroke-width="6"/><circle cx="66" cy="-92" r="8" fill="#1E1E1E"/><path d="M120 -40 q40 4 60 -10 M180 -50 l16 -12 M180 -50 l18 4" stroke="#D9534F" stroke-width="8" fill="none" stroke-linecap="round"/></g>`;
 return `<div class="f"><div class="a" style="inset:0;background:linear-gradient(#0d1530,#1d2a4a 55%,#3a2d24 56%,#22180f)"></div>
 <div class="a" style="inset:0;filter:blur(7px);opacity:.75"><svg width="1080" height="1920">${ASET.pohon(120,1040,2.2,M)}${ASET.pohon(980,1000,2.6,M)}${ASET.semak(560,1060,2,M)}</svg></div>
 <div class="a" style="left:-260px;top:1240px;width:1500px;opacity:.9;filter:brightness(.55) blur(2px)"><svg viewBox="0 0 900 500" width="1500" height="833" style="overflow:visible"><g transform="translate(40 40) scale(1.0)">${ASET.komodo(M,{lidah:1})}</g></svg></div>
 <svg class="a" width="1080" height="1920" style="left:0;top:0"><defs><radialGradient id="cahaya" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF2B8" stop-opacity=".95"/><stop offset="1" stop-color="#FFF2B8" stop-opacity="0"/></radialGradient></defs>
  <path d="M700 1400 L330 960 L300 1440 Z" fill="url(#cahaya)" opacity=".55"/><ellipse cx="520" cy="1190" rx="380" ry="300" fill="url(#cahaya)" opacity=".7"/>
  <g transform="translate(520 1230) scale(3.4)">${ASET.telur(0,0,1,1)}</g><g transform="translate(500 1060) scale(1.3)">${bayi}</g>
  <path d="M270 860 Q330 920 350 1000" stroke="#FF3B30" stroke-width="22" fill="none" stroke-linecap="round"/><path d="M314 972 L354 1012 L376 956" stroke="#FF3B30" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
 ${tebe({alisK:1,alisN:1,mataBesar:1,mulutBuka:.8,mulutLebar:.4,senyum:0,tanganK:[96,250],bentukK:'buka',tekukK:-1,tanganN:[60,330],bentukN:'kepal',tekukN:1,efek:'kaget',kepalaMiring:-8},600,'left:640px;top:1150px;')}

 <svg class="a" width="1080" height="1920" style="left:0;top:0"><g filter="url(#glow2)"><ellipse cx="150" cy="820" rx="22" ry="12" fill="#FFD34D"/><ellipse cx="225" cy="826" rx="22" ry="12" fill="#FFD34D"/></g><defs><filter id="glow2"><feGaussianBlur stdDeviation="5"/></filter></defs><ellipse cx="150" cy="820" rx="14" ry="7" fill="#fff6c0"/><ellipse cx="225" cy="826" rx="14" ry="7" fill="#fff6c0"/></svg>
 ${vignette}<div class="judul">HAMIL TANPA<br><span style="color:#FFC93C">PEJANTAN?</span></div></div>`;};
const S2=()=>{ // BAU HUJAN: senja hujan, Tebe close-up menghirup, aroma bercahaya penuh bakteri menuju wajah
 return `<div class="f"><div class="a" style="inset:0;background:linear-gradient(#4b4766,#8d6f7d 45%,#5a4a3e 46%,#3a2e25)"></div>
 <div class="a" style="inset:0;filter:blur(6px)"><svg width="1080" height="1920">${ASET.rumahKampung(540,1060,1.6,S)}${ASET.hujan(1080,1920,0.3,S,{})}</svg></div>
 <svg class="a" width="1080" height="1920" style="left:0;top:0"><defs><filter id="glow"><feGaussianBlur stdDeviation="14"/></filter></defs>
  <g filter="url(#glow)" opacity=".9"><path d="M80 1820 C200 1500 120 1300 420 1180 S760 900 640 700" stroke="#9BE7C4" stroke-width="90" fill="none" stroke-linecap="round" opacity=".55"/></g>
  <path d="M80 1820 C200 1500 120 1300 420 1180 S760 900 640 700" stroke="#CFF7E3" stroke-width="18" fill="none" stroke-linecap="round" stroke-dasharray="2 46" opacity=".9"/>
  <g transform="translate(250 1450) scale(1.2)">${ASET.streptomyces(0,0,1,S,0)}</g><g transform="translate(470 1150) scale(.8) rotate(-20)">${ASET.streptomyces(0,0,1,S,0,{benih:7})}</g>
  <g transform="translate(320 1660) scale(1.1)">${ASET.tetes(0,0,1,S)}</g><g transform="translate(860 1380) scale(.8)">${ASET.tetes(0,0,1,S)}</g></svg>
 ${tebe({mataSenyum:1,alisK:.6,alisN:.6,senyum:.6,mulutBuka:.25,mulutLebar:.25,pipi:1,kepalaMiring:-14,tanganK:[120,330],tanganN:[280,330]},980,'left:330px;top:420px;')}
 <div class="a" style="inset:0;background:linear-gradient(rgba(20,16,30,0) 60%,rgba(20,16,30,.55))"></div>${vignette}
 <div class="judul">BAU HUJAN<br><span style="color:#9BE7C4">DARI BAKTERI?</span></div></div>`;};
window.tampil=k=>{document.getElementById('o').innerHTML=(k==='s1'?S1:S2)();};
</script></body></html>
