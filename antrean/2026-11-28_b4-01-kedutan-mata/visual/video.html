<script>
const {cl,lin,oExp,ioS,oCub,oBack,sinIO,lerp,halus}=KS, A=ASET.KEDUTAN, C=A.C, KM=A.KAMAR;
const W=KS.waktu(window.WAKTU_KATA||[],[]);
window.JEDA=W.JEDA;
const KK=W.kata, KI=i=>KK[i]||{m:i*0.43,s:i*0.43+0.3};
const M=i=>KI(i).m, S=i=>KI(i).s;
const cel=i=>KK[i]&&KK[i-1]?(KK[i-1].s+KK[i].m)/2:i*0.43-0.05;
const AKHIR=KK.length?KK[KK.length-1].s:54.6;
window.DURASI=+(AKHIR+1.35).toFixed(2);
window.MUSIK='kamar-kedutan';
const D=()=>window.DURASI;
const LIN=x=>x;
const jalur=(T,awal,segs)=>{const v=Object.assign({},awal);for(const [a,b,tgt,ease] of segs){const k=(ease||ioS)(lin(T,a,b));if(k<=0)continue;for(const key in tgt)v[key]=lerp(v[key],tgt[key],k)}return v};
const pegas=(T,a,f=9,r=6)=>T<a?0:Math.exp(-(T-a)*r)*Math.sin((T-a)*f*Math.PI);
const nadi=(u,per)=>{if(u<0)return 0;const x=u%per;return cl(x/0.05)*Math.exp(-x*7)};

// ---------- helper ----------
const svgW=(s,st='')=>`<svg class="abs" width="1080" height="1920" style="left:0;top:0;overflow:visible;${st}">${s}</svg>`;
const svgBesar=(s,blur=0)=>`<svg class="abs" width="4000" height="3400" style="left:-1000px;top:-800px;${blur>0.05?`filter:blur(${blur.toFixed(2)}px)`:''}"><g transform="translate(1000 800)">${s}</g></svg>`;
const kamera=(isi,c)=>`<div class="abs" style="left:0;top:0;width:1080px;height:1920px;transform:translate(${(540-c.cx).toFixed(1)}px,${(960-c.cy).toFixed(1)}px) rotate(${(c.r||0).toFixed(2)}deg) scale(${c.z.toFixed(4)});transform-origin:${c.cx.toFixed(1)}px ${c.cy.toFixed(1)}px">${isi}</div>`;
const latar=(c)=>`<div class="abs" style="inset:0;background:${c}"></div>`;
function campur(p,q,k){if(k<=0)return p;const r=Object.assign({},p),e=cl(k);for(const key in q){const v=q[key];
 if(typeof v==='number')r[key]=lerp(p[key]??0,v,e);else if(Array.isArray(v))r[key]=[lerp(p[key][0],v[0],e),lerp(p[key][1],v[1],e)];else if(e>.5)r[key]=v}return r}
const TB={duduk:{cx:540,cy:1318,w:520},berdiri:{cy:1222}};
const mataDunia=(cx,cy,w)=>A.titikTebe(158,194,cx,cy,w);

// ===== BABAK 1: hook — kelopak bawah berkedut di frame 0, koin "rezeki" → BUKAN → jendela otot kelopak =====
const kMatamu=M(1),kKedutan=M(3),kKatanya=M(5),kRezeki=M(7),kBukan=M(8),kItu=M(9),kKelopak=M(11),kBerkedut=M(13),B2=cel(15);
const AT1=tebeAnimasi([{t:0,pose:'penasaran'},{t:kKedutan-.1,pose:'bingung',transisi:.35},{t:kKatanya,pose:'penasaran',transisi:.35},{t:kRezeki,pose:'semangat',transisi:.3},
 {t:kBukan-.02,pose:'kaget',transisi:.18},{t:kItu+.2,pose:'curiga',transisi:.45}],{benih:4});
const PEGANG_HP={tanganK:[176,376],tanganN:[228,376],bentukK:'kepal',bentukN:'kepal',tekukK:1,tekukN:-1};
function hpDiTangan(p,cx,cy,w,ang=0){const a=A.titikTebe((p.tanganK[0]+p.tanganN[0])/2,(p.tanganK[1]+p.tanganN[1])/2-14,cx,cy,w);return A.hp(a[0],a[1],w/520*.68,ang)}
function kamarDunia(T,st){
 // st: {tb:{p,cx,cy,w,o}, hp, meja:{...}, kamar:{...}, cam, depan:'' (svg dunia di depan Tebe), blur}
 let s=A.kamar(T,st.kamar||{});
 if(st.belakang)s+=st.belakang;
 const t=st.tb;
 if(t)s+=A.tebeSVG(t.p,t.cx,t.cy,t.w,Object.assign({tanpaBayang:true},t.o||{}));
 if(st.hp)s+=st.hp;
 s+=A.meja(T,st.meja||{});
 if(st.depan)s+=st.depan;
 return latar(C.UNGU2)+kamera(svgBesar(s,st.blur||0),st.cam)}
function setB1(T){
 let p=Object.assign(AT1(T),PEGANG_HP);
 // jari menyentuh bawah mata (1,0–2,2 dtk), lalu kembali memegang HP; tangan diam di meja saat "berkedut sendiri"
 const sentuh=halus(lin(T,kKedutan-.15,kKedutan+.25))*(1-halus(lin(T,kKatanya-.05,kKatanya+.35)));
 p.tanganK=[lerp(176,148,sentuh),lerp(376,242,sentuh)];p.bentukK=sentuh>.4?'tunjuk':'kepal';p.tekukK=1;
 const diam=halus(lin(T,kBerkedut-.45,kBerkedut));
 p.tanganK=[lerp(p.tanganK[0],150,diam),lerp(p.tanganK[1],384,diam)];p.tanganN=[lerp(228,252,diam),lerp(376,384,diam)];
 p.lihatX=lerp(p.lihatX,5,halus(lin(T,kKatanya,kKatanya+.3))*(1-halus(lin(T,kBukan,kBukan+.3))));p.lihatY=lerp(p.lihatY,-3,halus(lin(T,kKatanya,kKatanya+.3))*(1-halus(lin(T,kBukan,kBukan+.3))));
 p.efek=T>kBukan-.05&&T<kItu+.3?'kaget':'';
 const kd=Math.max(A.kedutPola(T+0.2,1),.12*Math.sin(T*3)**2);
 const jend=halus(lin(T,kItu,kItu+.45)), den=A.kedutPola(T+0.2,1);
 const {cx,cy,w}=TB.duduk, me=mataDunia(cx,cy,w);
 // koin "rezeki" melayang di samping mata → disilang → jatuh
 let depan='';
 const kn=halus(lin(T,kKatanya-.1,kKatanya+.5)), jatuh=lin(T,kBukan+.35,kBukan+.95);
 if(kn>0&&jatuh<1){const x=me[0]+262,y=me[1]-40-22*Math.sin(T*2.2)+jatuh*jatuh*900;
  depan+=A.koin(x,y,.72*kn,T,{a:cl(kn*2)*(1-jatuh)})+A.silang(x,y,.6,lin(T,kBukan-.04,kBukan+.22))}
 const cam=jalur(T,{cx:me[0]+70,cy:me[1]+40,z:2.05,r:0},[[0,kMatamu,{z:2.12},LIN],[kMatamu,kKedutan+.3,{cx:me[0]+20,cy:me[1]+30,z:2.6}],
  [kKatanya-.2,kRezeki+.1,{cx:me[0]+130,cy:me[1]-20,z:2.15}],[kBukan-.05,kBukan+.25,{z:2.25},oCub],
  [kItu,kKelopak+.2,{cx:me[0]+10,cy:me[1]+40,z:3.0}],[kBerkedut-.4,B2-.2,{cx:me[0]+60,cy:me[1]+170,z:2.25}],[B2-.25,B2+.3,{cx:me[0]+10,cy:me[1]+40,z:3.2}]]);
 return kamarDunia(T,{tb:{p,cx,cy,w,o:{kedut:kd,jendela:jend,denyut:den}},hp:diam<.9?`<g opacity="${(1-diam).toFixed(3)}">${hpDiTangan(p,cx,cy,w,-6)}</g>`:'',cam,depan,
  meja:{uap:.7},kamar:{jam:11.2+T*.01}})}

// ===== BABAK 2: penampang — cincin otot (karet gelang) → myokymia → serat NEMBAK acak → popcorn =====
const kOtot2=M(18),kMelingkar=M(19),kKaret=M(21),kKedutan2=M(23),kMio=M(26),kDiduga=M(27),kSerat=M(29),kNembak=M(30),kTanpa=M(32),kSuruh=M(34),
 kAneh=M(35),kBareng=M(38),kPopcorn=M(40),kMeletup=M(41),kSatu=M(42),B3=cel(43);
const SATU=A.SERAT[15];
function tembak(s,T){
 let n=0;
 if(s===SATU&&T>kNembak-.05)n=Math.max(n,nadi(T-(kNembak-.05),.78));
 const mulai=kBareng-.55+s.mulai*1.4;
 if(T>mulai&&s.lap>0)n=Math.max(n,nadi(T-mulai+s.fase*s.per,s.per));
 return n*(1-halus(lin(T,B3+.6,B3+1)))}
const ATP=tebeAnimasi([{t:0,pose:'penasaran'},{t:kMeletup,pose:'tertawa',transisi:.4}],{benih:9});
function setB2(T){
 const o={cincin:halus(lin(T,kOtot2-.3,kMelingkar+.45)),karet:lin(T,kKaret-.15,kKedutan2+.05),getarBawah:halus(lin(T,kKedutan2,kKedutan2+.4)),
  serat:halus(lin(T,kDiduga,kDiduga+.5)),tembak,perintah:halus(lin(T,kTanpa-.2,kTanpa+.3))*(1-halus(lin(T,kAneh,kAneh+.4)))};
 const cam=jalur(T,{cx:540,cy:900,z:1.3},[[B2,kOtot2+.2,{cy:880,z:1.0},oCub],[kOtot2+.2,kMio,{z:1.06},LIN],[kMio-.3,kMio+.4,{cx:540,cy:1010,z:1.22}],
  [kDiduga,kNembak+.1,{cx:560,cy:1090,z:1.62}],[kTanpa-.3,kTanpa+.35,{cx:520,cy:960,z:1.12}],[kAneh-.1,kBareng+.2,{cx:540,cy:1080,z:1.55}],
  [kBareng+.2,kPopcorn-.1,{z:1.6},LIN],[kPopcorn-.35,kPopcorn+.25,{cy:1290,z:1.45}],[kPopcorn+.25,B3+.3,{z:1.5},LIN]]);
 let h=latar(C.UNGU3)+kamera(svgBesar(A.penampang(T,o)),cam);
 // layar terbelah: panci popcorn naik dari bawah (ritme acak yang sama)
 const pn=halus(lin(T,kPopcorn-.35,kPopcorn+.2));
 if(pn>0){const y=lerp(1940,1010,pn);
  const tb=ATP(T);tb.lihatX=-5;tb.lihatY=-3;
  h+=`<div class="abs" style="left:40px;top:${y.toFixed(1)}px;width:1000px;height:340px;border-radius:36px;overflow:hidden;background:${C.UNGU1};box-shadow:0 -10px 30px rgba(10,4,20,.45);border:8px solid ${C.UNGU4}">
  <svg width="1000" height="340" style="position:absolute;left:0;top:0">${A.panciPopkorn(560,236,.62,T,{mulai:kPopcorn-.2})}${A.tebeSVG(tb,150,270,230,{tanpaBayang:true})}</svg></div>`}
 return h}

// ===== BABAK 3: kamar — pemicu (garis putus-putus) → berdiri, "berhenti!" → cermin → "Lho" =====
const kBiasa=M(43),kKait=M(44),kBegadang=M(46),kStres=M(47),kKopi=M(48),kMata=M(50),kHape=M(53),kTerus=M(54),kBerhenti=M(59),kKarena=M(60),kPerintah=M(64),
 kKamu=M(66),kMau=M(67),kPelotot=M(69),kCermin=M(71),kTetap=M(73),kJoget=M(74),kLho=M(76),kPenyebab=M(77),kPahami=M(81),B5=cel(83);
const AT3=tebeAnimasi([{t:0,pose:'netral'},{t:kBegadang,pose:'sedih',transisi:.4},{t:kStres,pose:'bingung',transisi:.35},{t:kKopi,pose:'penasaran',transisi:.35},
 {t:kMata,pose:'curiga',transisi:.35},{t:kTerus-.05,pose:'penasaran',transisi:.4},{t:kBerhenti-.2,pose:'menjelaskan',transisi:.3},
 {t:kKarena+.6,pose:'netral',jalan:[kKarena+.7,kKamu+.55],transisi:.4},{t:kPelotot-.1,pose:'curiga',transisi:.3},{t:kJoget+.1,pose:'bingung',transisi:.4},
 {t:kLho,pose:'kaget',transisi:.2},{t:kPenyebab+.4,pose:'berpikir',transisi:.5}],{benih:5});
const ATC=tebeAnimasi([{t:0,pose:'curiga'},{t:kJoget-.15,pose:'bingung',transisi:.4},{t:kLho,pose:'kaget',transisi:.2}],{benih:12});
const XC=1190;
function setB3(T){
 let p=AT3(T);
 const duduk=1-halus(lin(T,kTerus-.05,kTerus+.45));
 if(duduk>0){p=campur(p,Object.assign({},p,PEGANG_HP),duduk*(T<kTerus?1:1))}
 // menguap saat begadang
 const uap=Math.pow(Math.sin(Math.PI*lin(T,kBegadang-.05,kStres+.1)),1.4);
 p.mulutBuka=Math.max(p.mulutBuka,.85*uap);p.mataBuka=Math.min(p.mataBuka,1-.6*uap);
 // HP didekatkan ke mata
 const dekat=halus(lin(T,kMata-.1,kMata+.4))*(1-halus(lin(T,kTerus-.2,kTerus+.1)));
 // menunjuk mata sendiri saat "BERHENTI?"
 const tunjuk=halus(lin(T,kBerhenti-.25,kBerhenti+.1))*(1-halus(lin(T,kKarena+.4,kKarena+.8)));
 if(tunjuk>0){p.tanganK=[lerp(p.tanganK[0],120,tunjuk),lerp(p.tanganK[1],228,tunjuk)];p.bentukK='tunjuk';p.tekukK=1;p.alisK=lerp(p.alisK,-.8,tunjuk);p.alisN=lerp(p.alisN,-.8,tunjuk);p.alisMiringK=lerp(p.alisMiringK,-1,tunjuk);p.alisMiringN=lerp(p.alisMiringN,-1,tunjuk)}
 // melotot galak ke cermin
 const galak=halus(lin(T,kPelotot-.15,kPelotot+.2))*(1-halus(lin(T,kLho-.1,kLho+.2)));
 if(galak>0){p.alisK=lerp(p.alisK,-1,galak);p.alisN=lerp(p.alisN,-1,galak);p.alisMiringK=lerp(p.alisMiringK,-1.2,galak);p.alisMiringN=lerp(p.alisMiringN,-1.2,galak);p.mataBesar=Math.max(p.mataBesar,.9*galak);p.lihatX=lerp(p.lihatX,6,galak)}
 if(T>kLho-.05){p.lihatX=lerp(p.lihatX,0,halus(lin(T,kLho,kLho+.2)));p.lihatY=0}
 const berjalan=halus(lin(T,kKarena+.7,kKamu+.55));
 const cx=lerp(TB.duduk.cx,XC,berjalan), cy=lerp(TB.duduk.cy,TB.berdiri.cy,1-duduk), w=TB.duduk.w;
 const kd=A.kedutPola(T,1)*(T>kTetap-.1&&T<kLho?1.25:1);
 // pantulan di cermin (dibalik), ikut berkedut "tetap joget"
 let pant='';
 if(T>kKarena){const q=ATC(T);const g2=halus(lin(T,kPelotot-.15,kPelotot+.2));q.alisK=lerp(q.alisK,-1,g2*(1-halus(lin(T,kJoget-.15,kJoget+.25))));q.alisN=q.alisK;q.mataBesar=Math.max(q.mataBesar,.8*g2);q.lihatX=-6*g2;
  q.alisMiringK=lerp(0,-1.2,g2*(1-halus(lin(T,kJoget-.15,kJoget+.25))));q.alisMiringN=q.alisMiringK;
  pant=`<rect x="1300" y="800" width="520" height="700" fill="#7A5CB0" opacity=".55"/>`+A.tebeSVG(q,KM.cermin[0]+10,TB.berdiri.cy,w*1.0,{tanpaBayang:true,cermin:true,kedut:A.kedutPola(T+.02,1.3)})+`<rect x="1300" y="800" width="520" height="700" fill="#B9A3E6" opacity=".18"/>`}
 // garis putus-putus pemicu → mata
 const me=mataDunia(cx,cy,w);
 let dep='';
 const g1=lin(T,kBegadang-.1,kBegadang+.4),g2=lin(T,kStres,kStres+.4),g3=lin(T,kKopi,kKopi+.4),g4=lin(T,kMata+.2,kHape);
 const pudar=1-halus(lin(T,kTerus-.2,kTerus+.2));
 if(pudar>0)dep+=`<g opacity="${pudar.toFixed(3)}">${A.garisPutus(KM.jam[0]+60,KM.jam[1]+60,me[0]-20,me[1],g1,T)}${A.garisPutus(330,1300,me[0]-10,me[1]+10,g2,T)}${A.garisPutus(960,1360,me[0]+20,me[1]+10,g3,T)}</g>`;
 let hp='';
 if(duduk>0){if(dekat>0){p.tanganN=[lerp(p.tanganN[0],300,dekat),lerp(p.tanganN[1],330,dekat)]}const a=A.titikTebe(lerp(202,300,dekat),lerp(362,300,dekat),cx,cy,w);hp=`<g opacity="${duduk.toFixed(3)}">${A.hp(a[0],a[1],lerp(.68,.8,dekat),lerp(-6,0,dekat))}</g>`;
  if(g4>0)hp+=`<g opacity="${pudar.toFixed(3)}"><circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="${(90+20*Math.sin(T*4)).toFixed(1)}" fill="${C.KUNING2}" opacity="${(.22*halus(g4)).toFixed(3)}"/></g>`}
 const cam=jalur(T,{cx:560,cy:1180,z:1.32},[[B3-.2,kKait,{cx:560,cy:1150,z:1.0}],[kKait,kMata-.2,{z:1.04},LIN],[kMata-.2,kHape+.2,{cx:520,cy:1220,z:1.42}],
  [kTerus-.1,kTerus+.5,{cx:600,cy:1110,z:1.08}],[kKarena+.6,kKamu+.6,{cx:1300,cy:1130,z:1.0}],[kMau,kJoget,{cx:1320,cy:1120,z:1.16},LIN],
  [kLho-.06,kLho+.24,{cx:XC-60,cy:1150,z:1.7},oCub],[kLho+.3,B5+.3,{z:1.78},LIN]]);
 return kamarDunia(T,{tb:{p,cx,cy,w,o:{kedut:kd}},hp,cam,depan:dep,
  meja:{kertas:halus(lin(T,kStres-.05,kStres+.5)),mug2:lin(T,kKopi-.05,kKopi+.35),uap:.7},
  kamar:{jam:11.2+(T-B3)*.02+3.2*ioS(lin(T,kBegadang-.15,kBegadang+.6)),pantulan:pant}})}
// sisipan penampang kecil (bukan perintah dari kamu / penyebab belum dipahami)
function sisipan(T){
 const a1=halus(lin(T,kKarena-.1,kKarena+.3))*(1-halus(lin(T,kKamu+.2,kKamu+.55)));
 const a2=halus(lin(T,kPenyebab-.2,kPenyebab+.2))*(1-halus(lin(T,B5-.35,B5)));
 const a=Math.max(a1,a2);if(a<=0.001)return '';
 const o={cincin:1,serat:1,tembak:(s,t)=>(s.lap>0&&s.i%3===0)?nadi(t+s.fase*s.per,s.per):0,perintah:a1>0?1:0,getarBawah:.6};
 const bl=a2*5;
 return `<div class="abs" style="left:${(560).toFixed(0)}px;top:580px;width:330px;height:330px;border-radius:50%;overflow:hidden;border:10px solid ${C.KUNING};box-shadow:0 10px 30px rgba(10,4,20,.5);opacity:${a.toFixed(3)};transform:scale(${(.7+.3*a).toFixed(3)})">
 <svg width="310" height="310" viewBox="90 420 900 900" style="position:absolute;left:0;top:0;${bl>.05?`filter:blur(${bl.toFixed(1)}px)`:''}">${A.penampang(T,o)}</svg>
 ${a2>0?`<svg width="310" height="310" style="position:absolute;left:0;top:0">${A.tanya(150,170,1.35,halus(lin(T,kPenyebab,kPenyebab+.35)))}</svg>`:''}</div>`}

// ===== BABAK 4: papan 15 wajah — studi kecil, setahun lebih, tanpa tanda penyakit saraf =====
const kPenelitian=M(84),kKecil=M(85),kMengikuti=M(86),kLima=M(87),kPasien=M(89),kAwet=M(92),kSetahun=M(93),kNggakAda=M(95),kSaraf=M(101),B6=cel(102);
const AT4=tebeAnimasi([{t:0,pose:'penasaran'},{t:kNggakAda+.1,pose:'haru',tanda:'!',transisi:.4}],{benih:14});
function setB4(T){
 const nyala=15*lin(T,kMengikuti,kPasien+.1);
 const sapu=T>kNggakAda-.1?lin(T,kNggakAda-.1,kSaraf+.4):-1;
 let s=`<rect x="-200" y="-200" width="1480" height="2400" fill="${C.UNGU2}"/>`;
 for(let i=-3;i<12;i++)s+=`<rect x="${i*140}" y="-200" width="60" height="2400" fill="${C.UNGU1}" opacity=".22"/>`;
 s+=A.papan15(T,{nyala,sapu});
 s+=`<g opacity="${halus(lin(T,kSetahun-.1,kSetahun+.3)).toFixed(3)}">${A.kalender(430,1255,.4,T,{balik:7*ioS(lin(T,kSetahun,kNggakAda+.3))})}</g>`;
 const p=AT4(T);p.lihatX=4;p.lihatY=-4;
 if(T>kNggakAda){const lega=Math.sin(Math.PI*lin(T,kNggakAda+.1,kNggakAda+1.1));p.mulutBuka=Math.max(p.mulutBuka,.35*lega)}
 s+=A.tebeSVG(p,190,1170,230,{kedut:A.kedutPola(T,.7)*(1-halus(lin(T,kNggakAda,kNggakAda+.8)))*0+A.kedutPola(T,.5)});
 const cam=jalur(T,{cx:540,cy:960,z:1.06},[[B5,kPasien,{z:1.0,cy:930},LIN],[kSetahun-.2,kSaraf,{cx:560,cy:990,z:1.04},LIN],[kSaraf,B6+.3,{z:1.02},LIN]]);

function setB5(T){
 let p=AT5(T);

  [kItuW+.15,B7+.3,{cx:1860,cy:1090,z:1.0}]]);
 return kamarDunia(T,{tb:{p,cx,cy,w,o:{kedut:kd*(1-rapat),mataRapat:rapat,pipiNyala:pipi}},cam,meja:{kertas:1,mug2:1,uap:.5},kamar:{terang:halus(lin(T,kTapi,kTapi+.6)),jam:14.6+(T-B6)*.02}})}
