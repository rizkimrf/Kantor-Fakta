const AW=tebeAnimasi([{t:0,pose:'penasaran'},{t:k('nyaris').m,pose:'kaget',transisi:.2},{t:k('jago').m,pose:'menjelaskan',transisi:.3},{t:k('cek-aut.').s+.05,pose:'tertawa',transisi:.25}],{benih:11});
function setTimbang(T){const p=P.senja,ny=k('nyaris').m,nl=k('nol.').m,pr=k('para').m,jg=k('jago').m;
 const v=sinIO(lin(T,jg-.4,jg));
 let s=`<rect width="1080" height="1920" fill="#3A4660"/><g opacity="${1-v}">`;
 const r=lerp(230,18,ioS(lin(T,ny-.3,nl+.4)));
 s+=`<circle cx="540" cy="820" r="${r*1.6}" fill="#FFE27A" opacity=".15"/><circle cx="540" cy="820" r="${r}" fill="#FFC93C"/>`+(r>90?`<text x="540" y="${820+r*.14}" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="${r*.42}" fill="#1E1E1E">EFEK</text>`:tag(540,820-r-60,'EFEK','#FFC93C',1,'#1E1E1E',30));
 const deb=lin(T,pr-.2,pr+.3);
 if(deb>0)s+=`<g opacity="${deb}">`+A.ilmuwan(170,1560,.75,p,T)+A.ilmuwan(910,1560,.75,p,T+1,{rambut:'#4A3020',kulit:'#C98F6A'})+
  `<g transform="translate(250 1000) scale(${.6+.4*oBack(deb)})"><path d="M-80 -70 H80 Q100 -70 100 -50 V30 Q100 50 80 50 H-10 L-40 90 L-30 50 H-80 Q-100 50 -100 30 V-50 Q-100 -70 -80 -70Z" fill="#F4EEDC"/><text y="22" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="80" fill="#E8463C">!</text></g>
  <g transform="translate(830 960) scale(${.6+.4*oBack(lin(T,pr+.2,pr+.6))})"><path d="M-80 -70 H80 Q100 -70 100 -50 V30 Q100 50 80 50 H40 L30 90 L10 50 H-80 Q-100 50 -100 30 V-50 Q-100 -70 -80 -70Z" fill="#F4EEDC"/><text y="22" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="80" fill="#1F8A8A">?</text></g></g>`;
 s+=`</g>`;
 let b='';if(v>0){const mir=2+Math.sin(T*1.6)*1.2;
  b=`<g opacity="${v}"><rect width="1080" height="1920" fill="#E9D3B4"/><g style="filter:blur(5px)" opacity=".6">${A.rakMinimarket(-60,300,420,700,P.siang,{benih:21})}${A.rakMinimarket(720,300,420,700,P.siang,{benih:23})}</g>${A.mejaKasir(1080,1360,p,T,{mx:880})}
  ${A.timbangan(520,760,1,{miring:mir,kiri:A.awanMerahMuda(0,-10,.95,T),kanan:A.kerikil(0,-4,1)})}
  ${tag(220,1180,'KESAN MURAH','#F7A8C4',lin(T,jg,jg+.3),'#1E1E1E',28)}${tag(820,1140,'CHECKOUT','#F4EEDC',lin(T,k('cek-aut.').m-.1,k('cek-aut.').m+.2),'#1E1E1E',28)}</g>`}
 const tx=v>0?600:420,ty=v>0?1020:1000;
 return `<div class="abs" style="inset:0;transform:scale(${1.04-lin(T,ny,ny+6)*.04})"><svg class="abs" width="1080" height="1920">${s}${b}</svg>
 <div class="abs" style="left:${lerp(380,330,v)}px;top:${lerp(1060,1080,v)}px">${tebe(AW(T),280,.2)}</div></div>`+stempel('BISA NYARIS NOL',T,nl-.05,120,430,76,-5,'#FFC93C')}

// ===== B8 DEPAN MINIMARKET MALAM — Tebe keluar membawa belanjaan, digit kiri "ditimbang"
const AT=tebeAnimasi([{t:0,pose:'netral',jalan:[tengah(3)-.3,tengah(3)+1.6]},{t:tengah(3)+1.7,pose:'menjelaskan',bicara:[k('otak').m,k('kiri.',2).s],transisi:.3}],{benih:12});
function setToko(T){const p=P.malam,u=T-tengah(3),z=1.16-ioS(lin(u,0,5))*.14,jl=oCub(lin(u,-.3,1.6)),kk=lin(T,k('dijit',2).m-.2,k('kiri.',2).s);
 let s=A.tokoMalam(1080,1920,p,T)+A.labelHarga(540,560,.7,'99.900',{kiriBesar:kk,redupKanan:kk*.5,lebar:420});
 const tebeX=lerp(420,250,jl);
 return `<div class="abs" style="inset:0;transform:scale(${z});transform-origin:540px 1200px"><svg class="abs" width="1080" height="1920">${s}${A.kantongBelanja(tebeX+300,1310,.8)}</svg>
 <div class="abs" style="left:${tebeX}px;top:${930}px">${tebe(AT(T),300,1)}</div></div>`+stempel('BUKAN SIHIR',T,k('sihir.').m-.05,200,760,80,-5,'#FFC93C')}

// ===== OUTRO
const AO=tebeAnimasi([{t:0,pose:'bangga'},{t:T_OUTRO+.3,pose:'bangga',tanda:'!'},{t:k('barang').m,pose:'melambai',transisi:.4}],{benih:13});
function setOutro(T){return KS.outro(T,T_OUTRO,{anim:AO,cta:'Barang terakhir yang kamu beli berakhiran <span style="color:#FFC93C">900</span>, apa?',ctaMulai:k('barang').m-T_OUTRO-.1})}

const BABAK=[{a:0,f:setHook},{a:T_INTRO+.42,f:setKasir,tr:'tanpa'},{a:T3,f:setMata,tr:'dorong'},{a:k('syaratnya,').m-.03,f:setHP,tr:'geser'},{a:T5,f:setMobil,tr:'dorong'},
 {a:tengah(1),f:setPustaka,tr:'dorong'},{a:tengah(2),f:setTimbang,tr:'silang'},{a:tengah(3),f:setToko,tr:'geser'},{a:T_OUTRO,f:setOutro,tr:'dorong'}];
function labelBabak(T){return KS.label('CUMA BEDA Rp100',T,T_INTRO+2.5,T3-.1)+KS.label('DIBACA DARI KIRI',T,T3+.3,k('syaratnya,').m-.1)+KS.label('STUDI KLASIK: DIGIT KIRI',T,k('syaratnya,').m+.3,T5-.1)
 +KS.label('LELANG MOBIL BEKAS · AS',T,T5+.3,tengah(1)-.1)+KS.label('MENGGABUNGKAN 69 STUDI',T,tengah(1)+.3,tengah(2)-.1)+KS.label('PARA AHLI MASIH BERDEBAT',T,k('para').m,tengah(3)-.1)+KS.label('JADI, KENAPA 900?',T,tengah(3)+.3,T_OUTRO-.1)}
window.EFEK=[{t:k('atau').m,sfx:'pop',vol:.45},{t:k('menaksir...').m+.25,sfx:'pop',vol:.45},{t:T_INTRO+.02,sfx:'jingle',vol:.55},{t:T3b-.5,sfx:'whoosh',vol:.4},
 {t:k('melompat').m+.12,sfx:'boing',vol:.45},{t:k('nol.').m+.1,sfx:'ding',vol:.35},{t:T_OUTRO+.35,sfx:'ding_ganda',vol:.5}];

window.render=function(T){
 let h=KS.komposisi(T,BABAK);
 const intro=T>=T_INTRO&&T<T_INTRO+2.4, outro=T>=T_OUTRO-.3;
 h+=KS.vinyet(T,.3)+labelBabak(T);
 if(T>T_INTRO&&!intro&&!outro)h+=KS.teksLayar(T,GRUP,{y:1305});
 h+=KS.intro(T,T_INTRO)+KS.watermark(T,(T>1.2&&!intro&&!outro)?1:0);
 if(T<0.95){const kk=1-oCub(lin(T,.55,.95));h+=`<div class="abs" style="inset:0;opacity:${kk};transform:scale(${1+(1-kk)*.08})">${sampulGambar(T)}<div style="position:absolute;left:-220px;top:20px">${KS.logoKecil}</div></div>`;}
 h+=judulHook(T);
 h+=`<div class="abs" style="left:0;top:0;height:6px;background:#FFC93C;width:${(T/window.DURASI*1080).toFixed(1)}px"></div>`;
 document.getElementById('V').innerHTML=h;
};
window.render(0);
</script></body></html>
