<style>*{box-sizing:border-box;margin:0}body{width:1080px;height:1920px;overflow:hidden;background:#1A1214}
.abs{position:absolute}#V{position:absolute;inset:0;overflow:hidden}</style></head><body><div id="V"></div>
<script>
const {cl,lin,oExp,ioS,oCub,oBack,sinIO,lerp}=KS, P=ASET.PALET, A=ASET;
// ---------- peta waktu: intro setelah hook ("...rasa apa?"); 2,36 dtk sisipan + 0,21 celah alami = 2,57 dtk (batas 2,6) ----------
const W=KS.waktu(window.WAKTU_KATA||[],[{t:4.96,d:2.36}]);
window.JEDA=W.JEDA;
const J=W.JEDA, KK=W.kata, k=(w,n=1)=>W.cari(w,n);
const KI=i=>KK[i]||{m:0,s:0};
const cel=i=>KK[i]?(KK[i-1].s+KK[i].m)/2:0;
const AKHIR=KK.length?KK[KK.length-1].s:69;
window.DURASI=+(AKHIR+0.45).toFixed(2);
window.MUSIK='jenaka-ringan';
const T_INTRO=W.vt(J[0].t)-0.02, t2=T_INTRO+0.42;
const B3=cel(20),B4=cel(51),B5=cel(64),B6=cel(98),B7=cel(118),T_OUTRO=cel(131),B9=cel(151);

// ---------- Tebe + properti (koordinat rig 400x520) ----------
const KULIT='#F4C9A1',GRS='#1E1E1E';
function tebeX(p,w,o={}){
 let svg=tebeRigSVG(p).replace('width="400" height="520"','width="100%"');
 const kep=s=>s?`<g transform="translate(0 ${(-(p.nafas||0)*2+p.kepalaAngguk).toFixed(2)}) rotate(${p.kepalaMiring.toFixed(2)} 200 300)">${s}</g>`:'';
 const i=svg.lastIndexOf(' </g>\n</g></svg>');
 svg=svg.slice(0,i)+kep(o.kepala)+(o.tangan||'')+kep(o.kepalaAtas)+svg.slice(i);
 return `<div style="width:${w}px;${o.css||''}">${svg}</div>`}
const kepal=H=>`<circle cx="${H[0].toFixed(1)}" cy="${H[1].toFixed(1)}" r="17" fill="${KULIT}" stroke="${GRS}" stroke-width="6"/>`;
// kepedasan (pose turunan, hanya angka): mulut ternganga, mata terpejam, alis naik miring
function pedas(p,k){if(k<=0)return p;p.mulutBuka=lerp(p.mulutBuka,1,k);p.mulutLebar=lerp(p.mulutLebar,.85,k);p.mataBuka=Math.min(p.mataBuka,lerp(1,.1,k));
 p.alisK=lerp(p.alisK,.9,k);p.alisN=lerp(p.alisN,.9,k);p.alisMiringK=lerp(p.alisMiringK,.9,k);p.alisMiringN=lerp(p.alisMiringN,.9,k);p.senyum=lerp(p.senyum,-.3,k);p.pipi=lerp(p.pipi,1,k);p.mataSenyum=0;p.mataBesar=0;return p}
// lapisan wajah: merah padam, air mata, keringat, uap telinga
function wajahPedas(T,k,kr=0){if(k<=0&&kr<=0)return '';let s='';
 if(k>0)s+=`<ellipse cx="200" cy="222" rx="96" ry="58" fill="#FF3A2A" opacity="${(.22*k).toFixed(3)}"/>`+[158,242].map((x,i)=>{const u=(T*1.6+i*.5)%1;return `<path d="M${x+(i?14:-14)} 204 Q${x+(i?22:-22)} ${(230+u*20).toFixed(1)} ${x+(i?16:-16)} ${(250+u*30).toFixed(1)}" stroke="#7EC4E6" stroke-width="9" fill="none" stroke-linecap="round" opacity="${(.85*k).toFixed(3)}"/>`}).join('')
  +[[78,150,0],[322,150,.5]].map(([x,y,f])=>{const u=(T*.9+f)%1;return `<g opacity="${(k*Math.sin(Math.PI*u)*.7).toFixed(3)}"><circle cx="${(x+(x<200?-1:1)*u*40).toFixed(1)}" cy="${(y-u*90).toFixed(1)}" r="${(14+u*16).toFixed(1)}" fill="#FFFFFF"/></g>`}).join('');
 if(kr>0)[[118,120,0],[290,112,.35],[100,180,.7],[300,176,.15]].forEach(([x,y,f],i)=>{const u=(T*.55+f)%1,a=cl(kr*3-i*.5);s+=A.tetesKeringat(x,y+u*70,.55,a*(1-u*.6))});
 return s}
const apiMulut=(T,a,palsu,s=.55,rot=180)=>A.apiKartun(200,262,s,T,{a,palsu,rot});

// ---------- teks layar ----------
const GRUP=KS.teks(W,{gabung:[['empat puluh tiga derajat.','±43°'],['dua ribu dua puluh satu.','2021'],['dei-vid ju-li-us','David Julius'],['lapornya ke saraf nyeri.','LAPOR KE SARAF NYERI']],ganti:{'ju-li-us':'Julius'},
 tekan:['ketipu.','pengecap.','nyeri.','panas:','tubuh.','kebakar!','keringat.','bohongan.','burung.','menghindarinya.','utuh.','umpan.','nobel','palsu.','pendatang.','keringetan.'],maks:3});
const cap=(txt,T,a,b,o={})=>{const kk=oBack(lin(T,a-.05,a+.35),1.2)*(1-sinIO(lin(T,b-.3,b)));if(kk<=0)return '';
 return `<div class="abs" style="left:0;width:1080px;top:${o.y||470}px;text-align:center;transform:rotate(${o.rot??-4}deg) scale(${kk.toFixed(3)});opacity:${Math.min(1,kk*1.4).toFixed(3)}"><span style="display:inline-block;padding:6px 36px 14px;border:9px solid ${o.warna||'#FFC93C'};border-radius:24px;background:${o.bg||'rgba(30,14,18,.5)'};font:700 ${o.uk||92}px/1.05 Poppins;letter-spacing:-1px;color:${o.warna||'#FFC93C'};text-shadow:0 8px 20px rgba(0,0,0,.5)">${txt}</span></div>`};
const chip=(txt,x,y,a,warna='#FFC93C',uk=40)=>a<=0?'':`<g transform="translate(${x} ${y}) scale(${oBack(cl(a)).toFixed(3)})" opacity="${Math.min(1,a*2).toFixed(3)}"><rect x="${-txt.length*uk*.34-26}" y="${-uk*.95}" width="${txt.length*uk*.68+52}" height="${uk*1.4}" rx="${uk*.7}" fill="${warna}"/><text y="${uk*.18}" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="${uk}" letter-spacing="1" fill="#1E1E1E">${txt}</text></g>`;
const centang=(x,y,s,a)=>a<=0?'':`<g transform="translate(${x} ${y}) scale(${(s*oBack(cl(a))).toFixed(3)})" opacity="${cl(a*2).toFixed(3)}"><circle r="56" fill="#3FAE6A"/><path d="M-26 2 L-6 22 L28 -18" stroke="#FFF" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
const silang=(x,y,s,a)=>a<=0?'':`<g transform="translate(${x} ${y}) scale(${(s*oBack(cl(a))).toFixed(3)})" opacity="${cl(a*2).toFixed(3)}"><circle r="56" fill="#E2232E"/><path d="M-22 -22 L22 22 M22 -22 L-22 22" stroke="#FFF" stroke-width="14" stroke-linecap="round"/></g>`;

// ===== SAMPUL (frame 0) — merah cabai + hitam arang: Tebe BESAR di tengah, frontal, rim light merah, MENYEMBUR api kartun ke arah kamera;
//       cabai rawit raksasa miring di depan; termometer kecil kanan "37°" dilingkari merah (aneh, tidak membocorkan jawaban). Tanpa kata "sakit".
const ATS=tebeAnimasi([{t:0,pose:'kaget'}],{benih:3});
function sampulGambar(T){const t=T+1.3;let bg='',blur='';
 for(let i=0;i<18;i++){const a=i*Math.PI/9+.08;bg+=`<path d="M540 900 L${(540+2300*Math.cos(a)).toFixed(0)} ${(900+2300*Math.sin(a)).toFixed(0)} L${(540+2300*Math.cos(a+.15)).toFixed(0)} ${(900+2300*Math.sin(a+.15)).toFixed(0)}Z" fill="#FF3A2A" opacity=".07"/>`}
 [[130,520,.9,-40],[880,470,.8,200],[110,1180,1.0,30],[960,1580,.9,150],[700,1760,.8,-20],[260,1820,.7,60]].forEach(([x,y,s,r])=>blur+=A.cabaiRawit(x,y,s,{rot:r,bayang:0,warna:'#9A1A20',gelap:'#6A1016'}));
 const tb=ATS(.3);Object.assign(tb,{tanganK:[70,200],tanganN:[330,200],bentukK:'buka',bentukN:'buka',tekukK:-1,tekukN:1,kepalaMiring:0,condong:0,efek:''});pedas(tb,1);
 const TBW=700,TX=190,TY=560;
 const tebeSvg=tebeX(tb,TBW,{kepalaAtas:wajahPedas(t,1,1),css:'filter:drop-shadow(0 0 10px #FF4A2A) drop-shadow(0 0 34px rgba(226,35,46,.9))'});
 const mx=TX+200*TBW/400, my=TY+262*TBW/400;
 return `<svg class="abs" width="1080" height="1920"><defs><radialGradient id="sgk" cx=".5" cy=".47" r=".8"><stop offset="0" stop-color="#5A1218"/><stop offset=".5" stop-color="#2A1214"/><stop offset="1" stop-color="#120C0E"/></radialGradient>
 <radialGradient id="sgg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FF3A2A" stop-opacity=".75"/><stop offset="1" stop-color="#E2232E" stop-opacity="0"/></radialGradient></defs>
 <rect width="1080" height="1920" fill="url(#sgk)"/>${bg}<g style="filter:blur(9px)" opacity=".8">${blur}</g>
 <ellipse cx="540" cy="900" rx="520" ry="560" fill="url(#sgg)"/></svg>
 <div class="abs" style="left:${TX}px;top:${TY}px">${tebeSvg}</div>
 <svg class="abs" width="1080" height="1920">${semburApi(mx,my+28,1720,430,t)}
 ${A.cabaiRawit(-60,1700,2.7,{rot:-27,bayang:0})}
 ${A.termometer(890,1330,.8,.35,{teks:'37°',uk:66,teksY:-350})}<ellipse cx="890" cy="1135" rx="150" ry="235" fill="none" stroke="#E2232E" stroke-width="14" opacity=".95" transform="rotate(8 890 1135)"/></svg>
 <svg class="abs" width="1080" height="1920"><defs><radialGradient id="sv" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#0A0606" stop-opacity="0"/><stop offset="1" stop-color="#0A0606" stop-opacity=".7"/></radialGradient></defs><rect width="1080" height="1920" fill="url(#sv)"/></svg>
 <div class="abs" style="left:0;width:1080px;top:262px;text-align:center;font:700 148px/1.0 Poppins;letter-spacing:-3px;color:#fff;-webkit-text-stroke:22px #14080A;paint-order:stroke fill;text-shadow:0 10px 0 rgba(0,0,0,.4)">PEDAS =<br><span style="color:#FFC93C">RASA APA?</span></div>`}
// semburan api kerucut: sempit di mulut, melebar ke arah kamera (bawah), tepi bergelombang
function semburApi(x0,y0,y1,w1,t){const lap=[[1,'#E2232E'],[.72,'#FF7A2A'],[.44,'#FFC93C'],[.2,'#FFF1C0']];let o='';
 lap.forEach(([k,c],j)=>{const n=14,wa=26*k,wb=w1*k,pts=[];
  for(let i=0;i<=n;i++){const v=i/n,y=y0+(y1-y0)*v*(.75+.25*k),w=lerp(wa,wb,Math.pow(v,.8)),g=Math.sin(t*9+i*1.7+j)*18*v;pts.push([x0-w-g,y]);}
  const kanan=[];for(let i=n;i>=0;i--){const v=i/n,y=y0+(y1-y0)*v*(.75+.25*k),w=lerp(wa,wb,Math.pow(v,.8)),g=Math.sin(t*8+i*2.1+j+1)*18*v;kanan.push([x0+w+g,y]);}
  const yb=y0+(y1-y0)*(.75+.25*k);let d='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
  for(let i=0;i<5;i++){const xx=x0-wb+(i+.5)*wb*2/5;d+=` Q${(xx-wb/5).toFixed(1)} ${(yb+60*k+Math.sin(t*10+i)*20).toFixed(1)} ${(xx+wb/5).toFixed(1)} ${yb.toFixed(1)}`}
  d+=' L'+kanan.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+'Z';o+=`<path d="${d}" fill="${c}"/>`});
 return `<g style="filter:drop-shadow(0 0 30px rgba(255,120,40,.8))">${o}</g>`}
function judulHook(T){const a=sinIO(lin(T,KI(6).m-.1,KI(6).m+.25))*(1-sinIO(lin(T,KI(10).s+.05,KI(10).s+.4)));if(a<=0)return '';
 return `<div class="abs" style="left:0;width:1080px;top:262px;text-align:center;opacity:${a.toFixed(3)};transform:scale(${(.92+.08*a).toFixed(3)});font:700 140px/1.02 Poppins;letter-spacing:-3px;color:#fff;-webkit-text-stroke:20px #1A0C0E;paint-order:stroke fill;text-shadow:0 10px 0 rgba(0,0,0,.35)">PEDAS ITU<br><span style="color:#FFC93C">RASA APA?</span></div>`}

// ===== B1 HOOK — warung senja: Tebe menggigit cabai (kres), API menyembur di "kebakar", lalu apinya jadi garis putus (palsu) di "ketipu"; zoom ke wajah di "rasa apa?"
const KG=0.62, KBk=KI(2).m, KTp=KI(5).m, KJd=KI(6).m;
const AH=tebeAnimasi([{t:0,pose:'penasaran'},{t:KG+.1,pose:'kaget',transisi:.2},{t:KTp,pose:'bingung',transisi:.35},{t:KJd+.2,pose:'netral',transisi:.4}],{benih:4});
function cabaiDiTangan(H,rot=-60,s=.42,o={}){return A.cabaiRawit(H[0]+6,H[1]-6,s,{rot,bayang:0,...o})+kepal(H)}
function setHook(T){const p=P.senja,zm=ioS(lin(T,KJd-.2,KI(10).s+.3)),z=1.02+.03*ioS(lin(T,0,KJd))+.3*zm;
 const bg=A.warungBakso(1080,1920,p,T,{meja:1330});
 const pa=AH(T),gig=ioS(lin(T,.2,KG)),lep=ioS(lin(T,KG+.05,KG+.4));
 // tangan kanan membawa cabai ke mulut lalu turun setelah gigitan
 pa.tanganN=[lerp(lerp(300,214,gig),300,lep),lerp(lerp(340,250,gig),330,lep)];pa.bentukN='kepal';pa.tekukN=1;
 const pk=lin(T,KG,KG+.25)*(1-ioS(lin(T,KJd+.4,KI(10).s+.3))*.5);pedas(pa,pk);
 const api=lin(T,KG+.08,KBk+.15)*(1-ioS(lin(T,KJd+.3,KI(10).s)));const pal=ioS(lin(T,KTp-.15,KTp+.35));
 const tangan=cabaiDiTangan(pa.tanganN,-70,.42,{belah:lep});
 return `<div class="abs" style="inset:0;transform:scale(${z.toFixed(4)});transform-origin:540px 960px"><svg class="abs" width="1080" height="1920">${bg}</svg>
 <div class="abs" style="left:200px;top:${(700+Math.sin(T*2)*3).toFixed(1)}px">${tebeX(pa,680,{tangan,kepalaAtas:wajahPedas(T,pk,ioS(lin(T,KJd,KI(10).s)))+apiMulut(T,api,pal,.62)})}</div>
 <svg class="abs" width="1080" height="1920">${A.cobekSambal(830,1360,.62,T)}${A.mangkukBakso(180,1360,.5,T)}</svg></div>`}

// ===== B2 WARUNG DEKAT — "Habis nyambel, dahi KERINGETAN" → keringat bercucuran; "suhu mulutmu biasa aja" → termometer di mulut 37°; kamera dorong ke mulut
const KKr=KI(14).m, KPd=KI(15).m, KSu=KI(16).m, KBa=KI(18).m;
const AG=tebeAnimasi([{t:0,pose:'netral'},{t:t2+.1,pose:'kaget',transisi:.3},{t:KPd,pose:'curiga',transisi:.35},{t:KBa,pose:'bingung',transisi:.35}],{benih:5});
function setDekat(T){const p=P.senja,u=T-t2,dor=ioS(lin(T,B3-.9,B3+.3)),z=1.25+.08*ioS(lin(u,0,3))+.9*dor, orb=Math.sin(u*.5)*30;
 const bg=A.warungBakso(1200,1920,p,T,{meja:1360});
 const pa=AG(T),pk=1-ioS(lin(T,KPd-.2,KPd+.3))*.55;pedas(pa,pk);
 const tm=ioS(lin(T,KSu-.25,KSu+.25));
 if(tm>0){pa.mulutBuka=Math.min(pa.mulutBuka,lerp(pa.mulutBuka,.25,tm));pa.mataBuka=Math.max(pa.mataBuka*.0+pa.mataBuka,0);}
 const term=tm>0?`<g opacity="${cl(tm*2).toFixed(3)}" transform="translate(222 262) rotate(${(-120+Math.sin(T*2)*3).toFixed(1)}) scale(${(.3*(.7+.3*tm)).toFixed(3)})">${A.termometer(0,0,1,.35,{})}</g>`:'';
 const mulutX=330+200*560/400, mulutY=790+262*560/400;
 return `<div class="abs" style="left:0;top:0;width:1200px;height:1920px;transform:translateX(${(-60+orb).toFixed(1)}px) scale(${z.toFixed(4)});transform-origin:${mulutX.toFixed(0)}px ${mulutY.toFixed(0)}px"><svg class="abs" width="1200" height="1920">${bg}</svg>
 <div class="abs" style="left:330px;top:${(790+Math.sin(T*2)*3).toFixed(1)}px">${tebeX(pa,560,{kepalaAtas:wajahPedas(T,pk,ioS(lin(T,KKr-.15,KKr+.4)))+term})}</div>
 <svg class="abs" width="1200" height="1920">${A.cobekSambal(1010,1400,.6,T)}${chip('37° = NORMAL',600,700,lin(T,KSu+.1,KSu+.45),'#FFF4DC',44)}</svg></div>`}

// ===== B3 DALAM MULUT — lidah: sel pengecap manis & asin menyala; saraf nyeri (kabel kuning) dengan gerbang TRPV1 + termometer ambang 43° → 37°;
//       molekul kapsaisin menempel, ambang merosot, gerbang terbuka (fwoosh), api garis-putus (palsu) meletup — suhu tetap 37°
const KMn=KI(20).m,KAs=KI(22).m,KPe=KI(26).m,KSn=KI(29).m,KSr=KI(31).m,KNm=KI(36).m,KEm=KI(39).m,KKp=KI(43).m,KBkn=KI(45).m,KSt=KI(49).m,KBk3=KI(50).s;
const BUKA=KSt+.12;
const AM=tebeAnimasi([{t:0,pose:'penasaran'},{t:KMn,pose:'menjelaskan',transisi:.35},{t:KPe,pose:'menghitung',transisi:.35},{t:KSr-.3,pose:'penasaran',transisi:.35,jalan:[KSr-.3,KSr+1.1]},{t:KNm,pose:'menjelaskan',transisi:.35},{t:KKp,pose:'kaget',transisi:.3},{t:BUKA,pose:'kaget',transisi:.2,loncat:true,tanda:'!'}],{benih:6});
const GX=1560,GY=900;
function setMulut(T){const u=T-B3;
 // kamera: sel pengecap (kiri) → Tebe & saraf → close-up gerbang (termometer kiri, Tebe kanan) → mendongak mengikuti sinyal
 const c1=ioS(lin(T,KPe-.5,KPe+.6)),c2=ioS(lin(T,KSr-.3,KSr+1.1)),c3=ioS(lin(T,BUKA+.25,B4+.25));
 const cx=lerp(lerp(620,1250,c1),1580,c2), cy=lerp(lerp(960,960,c1),GY+40,c2)-c3*320, z=lerp(lerp(1.0+.04*ioS(lin(u,0,2)),1.0,c1),1.35,c2)*(1+.04*c3);
 let s=A.dalamMulut(2400,1920,T,{lidah:1180});
 s+=A.selPengecap(420,1250,1.1,T,{jenis:'manis',nyala:ioS(lin(T,KMn-.1,KMn+.3))})+A.selPengecap(760,1270,1.1,T,{jenis:'asin',nyala:ioS(lin(T,KAs-.1,KAs+.3))});
 const d=`M${GX} 1900 C${GX} 1500 ${GX-40} 1200 ${GX} ${GY} C${GX+40} 640 ${GX-20} 300 ${GX+80} -200`;
 const sn=lin(T,KSn-.1,KSn+.5);
 s+=`<g opacity="${(.55+.45*sn).toFixed(3)}">${A.sarafNyeri(d,T,{tebal:40})}</g>`;
 if(sn>0&&T<KSr)s+=A.sinyalSaraf([[GX,1700],[GX,GY]],T,{maju:lin(T,KSn,KSn+.7),n:4});
 const molK=ioS(lin(T,KKp-.1,KKp+.8)), ambang=lerp(.65,.35,ioS(lin(T,KBkn,KSt+.05))), buka=ioS(lin(T,BUKA-.05,BUKA+.25));
 s+=A.kanalTRPV1(GX,GY,.9,T,{buka,nyala:buka});
 if(T>KKp-.2){const mx=lerp(1150,GX-110,molK),my=lerp(560,GY-20,molK)+Math.sin(T*3)*10*(1-molK);s+=A.molekulKapsaisin(mx,my,.7,T,{rot:lerp(-30,0,molK)})}
 const tA=ioS(lin(T,KNm-.2,KNm+.3));
 if(tA>0){const tx=GX-250,ty=GY+300,teksAmb=ambang>.6?'43°':(ambang<.37?'37°':Math.round(30+ambang*20)+'°');
  s+=`<g opacity="${tA.toFixed(3)}">${A.termometer(tx,ty,1.0,.35,{ambang,ambangTeks:teksAmb,ambangWarna:'#FFC93C',teks:'SUHU MULUT',uk:34,teksY:-340})}</g>`}
 if(T>BUKA-.05){const a=lin(T,BUKA,BUKA+.25);s+=A.apiKartun(GX,GY-130,.95,T,{a,palsu:1})}
 if(T>BUKA)s+=A.sinyalSaraf([[GX,GY-60],[GX+10,600],[GX+50,0],[GX+80,-200]],T,{maju:lin(T,BUKA+.25,B4+.3),n:5});
 const pa=AM(T),tbx=lerp(1020,1620,c2);
 return `<div class="abs" style="left:0;top:0;width:2400px;height:1920px;transform:translate(${(540-cx).toFixed(1)}px,${(960-cy).toFixed(1)}px) scale(${z.toFixed(4)});transform-origin:${cx.toFixed(1)}px ${cy.toFixed(1)}px"><svg class="abs" width="2400" height="1920">${s}</svg>
 <div class="abs" style="left:${tbx.toFixed(1)}px;top:${(880+Math.sin(T*2)*3).toFixed(1)}px">${tebeX(pa,280,{css:c2>.02&&c2<.98?'transform:scaleX(1)':''})}</div></div>`}

// ---------- komposisi: KS.komposisi + transisi 'naik' (kamera menyapu vertikal mengikuti sinyal saraf) ----------
function lapis(html,gaya){return `<div style="position:absolute;inset:0;overflow:hidden;${gaya}">${html}</div>`}
function komposisi(T,BABAK){let i=0;while(i+1<BABAK.length&&BABAK[i+1].a<=T)i++;
 const kini=BABAK[i],lanjut=BABAK[i+1],dur=b=>b.d||.6;
 let dari=null,ke=null,uu=0;
 if(lanjut&&lanjut.tr==='naik'&&T>lanjut.a-dur(lanjut)/2){dari=kini;ke=lanjut;uu=(T-(lanjut.a-dur(lanjut)/2))/dur(lanjut)}
 else if(i>0&&kini.tr==='naik'&&T<kini.a+dur(kini)/2){dari=BABAK[i-1];ke=kini;uu=(T-(kini.a-dur(kini)/2))/dur(kini)}
 if(!dari)return KS.komposisi(T,BABAK);
 const e=sinIO(uu),bl=(Math.sin(Math.PI*cl(uu))*8).toFixed(1);
 return lapis(dari.f(T),`transform:translateY(${(e*1920).toFixed(1)}px);filter:blur(${bl}px)`)+lapis(ke.f(T),`transform:translateY(${((e-1)*1920).toFixed(1)}px);filter:blur(${bl}px)`)}
