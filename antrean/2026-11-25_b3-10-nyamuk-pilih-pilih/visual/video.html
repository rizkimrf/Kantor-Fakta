<style>*{box-sizing:border-box;margin:0}body{width:1080px;height:1920px;overflow:hidden;background:#0E1C3E}
.abs{position:absolute}#V{position:absolute;inset:0;overflow:hidden}</style></head><body><div id="V"></div>
<script>
const {cl,lin,oExp,ioS,oCub,oBack,sinIO,lerp,halus}=KS, N=ASET.NYAMUK, C=N.C, LG=ASET.LAGU;
const W=KS.waktu(window.WAKTU_KATA||[],[{t:45.59,d:0.4}]);
window.JEDA=W.JEDA;
const KK=W.kata, KI=i=>KK[i]||{m:i*0.43,s:i*0.43+0.3};
const cel=i=>KK[i]&&KK[i-1]?(KK[i-1].s+KK[i].m)/2:i*0.43;
const AKHIR=KK.length?KK[KK.length-1].s:53.92;
window.DURASI=+(AKHIR+0.72).toFixed(2);
window.MUSIK='teras-malam';
const D=()=>window.DURASI;
const puls=(T,a,d)=>Math.pow(Math.sin(Math.PI*cl((T-a)/d)),2);
// kedip dengan dataran (naik 4 frame, tahan ±4 frame, turun 4 frame) → tidak terbaca 'frame dobel' oleh cek_mulus
const kedip=(T,a)=>halus(lin(T,a,a+.13))*(1-halus(lin(T,a+.26,a+.39)));

// ---------- helper ----------
function tebeX(p,w,o={}){let svg=tebeRigSVG(p).replace('width="400" height="520"','width="100%"');
 const i=svg.lastIndexOf(' </g>\n</g></svg>');if(i>0&&o.tangan)svg=svg.slice(0,i)+o.tangan+svg.slice(i);
 return `<div style="width:${w}px;${o.css||''}">${svg}</div>`}
function campur(p,q,k){if(k<=0)return p;const r=Object.assign({},p),e=cl(k);for(const key in q){const v=q[key];
 if(typeof v==='number')r[key]=lerp(p[key]??0,v,e);else if(Array.isArray(v))r[key]=[lerp(p[key][0],v[0],e),lerp(p[key][1],v[1],e)];else if(e>.5)r[key]=v}return r}
const svgW=(w,h,s,st='')=>`<svg class="abs" width="${w}" height="${h}" style="left:0;top:0;overflow:visible;${st}">${s}</svg>`;
const svgBesar=(s,blur=0)=>`<svg class="abs" width="3600" height="3400" style="left:-1000px;top:-800px;${blur>0.05?`filter:blur(${blur.toFixed(2)}px)`:''}"><g transform="translate(1000 800)">${s}</g></svg>`;
const kamera=(isi,cx,cy,z)=>`<div class="abs" style="left:0;top:0;width:1080px;height:1920px;transform:translate(${(540-cx).toFixed(1)}px,${(960-cy).toFixed(1)}px) scale(${z.toFixed(4)});transform-origin:${cx.toFixed(1)}px ${cy.toFixed(1)}px">${isi}</div>`;
const latar=(c)=>`<div class="abs" style="inset:0;background:${c}"></div>`;
// jalur: nilai bergerak dari 'awal' ke tiap target berurutan (ioS), selalu kontinu
const LIN=x=>x;
const jalur=(T,awal,segs)=>{const v=Object.assign({},awal);for(const [a,b,tgt,ease] of segs){const k=(ease||ioS)(lin(T,a,b));if(k<=0)continue;for(const key in tgt)v[key]=lerp(v[key],tgt[key],k)}return v};
const cap=(txt,T,a,b,o={})=>{const kk=halus(lin(T,a-.05,a+.25))*(1-halus(lin(T,b-.25,b)));if(kk<=0)return '';
 return `<div class="abs" style="left:90px;width:900px;top:${o.y||270}px;text-align:center;transform:rotate(${o.rot??-2}deg) scale(${(.86+.14*kk).toFixed(3)});opacity:${kk.toFixed(3)}"><span style="display:inline-block;max-width:860px;padding:6px 30px 12px;border:8px solid ${o.warna||C.LIMAU};border-radius:24px;background:${o.bg||'rgba(10,20,46,.82)'};font:700 ${o.uk||78}px/1.05 Poppins;letter-spacing:-1px;color:#FFFFFF;text-shadow:0 6px 16px rgba(0,0,0,.45)">${txt}</span></div>`};
const L=(s)=>`<span style="color:${C.LIMAU}">${s}</span>`;

// ===== DUNIA TERAS (dipakai sampul, babak 1-2, babak 8) =====
const TX=50,TY=740,TW=540,TS=TW/400, LANTAI=1420;
const tw=(x,y)=>[TX+x*TS,TY+y*TS];               // titik lokal Tebe → dunia
const MULUT=tw(200,262), BETIS=tw(226,446);
const BENTOL=[[224,440],[234,459],[215,466],[178,436],[190,458],[236,430]];
const RUTE=[MULUT,[640,1000],[1000,900],[1360,820],[1720,740]];
const AT0=tebeAnimasi([{t:0,pose:'netral'}],{benih:3});
const MERINGIS={alisK:.95,alisN:.95,alisMiringK:.5,alisMiringN:.5,mataBuka:1,mataBesar:.55,senyum:-.45,mulutBuka:.5,mulutLebar:.4,kepalaMiring:-4,lihatX:5,lihatY:-1,pipi:.85};
function tepuk(p,tc,k){ // tangan kiri menepuk betis, periode 1,35 dtk; tc=0 → tangan tepat di betis
 if(k<=0)return p;const naik=.5-.5*Math.cos(2*Math.PI*tc/1.35);
 return campur(p,Object.assign({},MERINGIS,{tanganK:[176,446-62*naik],bentukK:'buka',tekukK:-1}),k)}
function stSampul(tc){
 const tb=tepuk(AT0(10+tc),tc,1);tb.kepalaMiring=-6+Math.sin(tc*1.6)*2;
 return {cam:{cx:540,cy:960,z:1},tebe:tb,bentol:3,blurTeman:5,teman:'senang',
  big:{x:690+Math.sin(tc*1.3)*10,y:930+Math.sin(tc*2.2)*10,s:1.7,arah:-1,ekspresi:'seringai',kacamata:0,kepala:-4,glow:1,a:1},
  kecil:[],pita:{k:0,a:0},bau:0,awan:null,judul:1,panah:1,lencana:[0,0],hp:0,pesawat:-1,tangan:''}}
function teras(T,st){
 let bg=N.terasMalam(-1000,-800,3600,3400,T,{lantai:LANTAI,dindingX:-900,dindingW:1180,bulan:[1560,260]});
 bg+=N.kursi(660,LANTAI,.86,C.TEAL);
 bg+=N.bohlam(820,640,1,T,{tali:520,kedip:st.kedip||0});
 // teman santai (buram, tanpa sorotan kaki)
 let tm=N.kursi(990,LANTAI+3,.95,'#E4E9F2',{gelap:'#B9C2D3'})+LG.orang(990,LANTAI,.92,T,{duduk:1,ekspresi:st.teman,baju:'#F2EEE2',celana:'#3D5A8A',rambut:'pendek',kulit:'#C98F6A',kulitG:'#A8724F',fase:2})+N.gelasTeh(1090,1262,.95,T);
 // Tebe
 const tb=st.tebe, tebeHtml=`<div class="abs" style="left:${TX}px;top:${TY}px">${st.tangan?tebeX(tb,TW,{tangan:st.tangan}):KS.tebe(tb,TW)}</div>`;
 let ov='';
 const tgK=tb.tanganK, tgA=cl((tgK[1]-392)/24);
 BENTOL.forEach(([x,y],i)=>{const k=cl(st.bentol-i);if(k>0){const p=tw(x,y);ov+=N.bentol(p[0],p[1],TS*.95,k)}});
 // tangan kiri menepuk betis: rig menggambar tangan di belakang celana → tangan digambar ulang di depan (gaya rig: kulit + garis gelap)
 if(tgA>0){const p=tw(tgK[0],tgK[1]);ov+=`<g opacity="${tgA.toFixed(3)}" transform="translate(${p[0].toFixed(1)} ${p[1].toFixed(1)}) scale(${TS})"><path d="M-6 -34 Q-12 -12 -4 0" stroke="#1E1E1E" stroke-width="40" stroke-linecap="round" fill="none"/><path d="M-6 -34 Q-12 -12 -4 0" stroke="#FFC93C" stroke-width="29" stroke-linecap="round" fill="none"/><ellipse cx="0" cy="8" rx="24" ry="19" fill="#F4C9A1" stroke="#1E1E1E" stroke-width="6"/><path d="M-14 22 l0 10 M-2 25 l0 10 M10 22 l0 10" stroke="#1E1E1E" stroke-width="5" stroke-linecap="round"/></g>`}
 ov+=N.pita(RUTE,T,{k:st.pita.k,a:st.pita.a});
 if(st.bau>0){ov+=N.titikBau(BETIS[0],BETIS[1],T,{a:st.bau,n:14,tinggi:330,lebar:40,r:11});ov+=N.titikBau(tw(176,446)[0],BETIS[1],T+.4,{a:st.bau*.8,n:9,tinggi:260,lebar:30,r:9})}
 if(st.awan)ov+=N.awanSial(st.awan.x,st.awan.y,1,T,st.awan.a).replace('<g opacity',`<g transform="rotate(${st.awan.rot.toFixed(1)} ${st.awan.x} ${st.awan.y})" opacity`);
 for(const m of st.kecil)if(m.a>0)ov+=`<g opacity="${m.a.toFixed(3)}">${N.nyamuk(m.x,m.y,m.s,T,{arah:m.arah,benih:m.b,ekspresi:m.e||'biasa'})}</g>`;
 const b=st.big;
 if(b.a>0)ov+=`<g opacity="${b.a.toFixed(3)}">${N.nyamuk(b.x,b.y,b.s,T,{benih:1,arah:b.arah,ekspresi:b.ekspresi,kacamata:b.kacamata,kepala:b.kepala,glow:b.glow,lihat:b.lihat})}</g>`;
 if(st.panah>0)ov+=`<g opacity="${st.panah.toFixed(3)}" transform="translate(${(Math.sin(T*4)*5).toFixed(1)} 0)"><path d="M700 1395 Q570 1445 462 1388" stroke="#E2232E" stroke-width="26" fill="none" stroke-linecap="round"/><path d="M476 1344 L404 1374 L462 1428Z" fill="#E2232E"/></g>`;
 const [lk,ld]=st.lencana;
 if(lk>0)ov+=`<g transform="rotate(${(Math.sin(T*2.4)*8*(1-.5*lk)).toFixed(1)} 320 490)">${N.lencana(320,640,.95*(.6+.4*oBack(lk)),'kamu',cl(lk*1.4))}</g>`;
 if(ld>0)ov+=`<g transform="rotate(${(Math.sin(T*2.4+1)*8*(1-.5*ld)).toFixed(1)} 980 580)">${N.lencana(980,730,.85*(.6+.4*oBack(ld)),'dia',cl(ld*1.4))}</g>`;
 if(st.pesawat>=0&&st.pesawat<1){const u=st.pesawat,x=lerp(420,900,u),y=lerp(1060,900,u)-Math.sin(Math.PI*u)*140;ov+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(-20)" opacity="${(1-u*.5).toFixed(3)}"><path d="M-40 0 L40 -20 L-10 20Z" fill="#FFFFFF"/><path d="M-10 20 L0 6 L40 -20Z" fill="${C.ABU2}"/></g>`}
 const c=st.cam;
 return latar(C.LANGIT)+kamera(svgBesar(bg,3)+svgBesar(tm,st.blurTeman)+tebeHtml+svgW(1080,1920,ov),c.cx,c.cy,c.z)}
function judulSampul(a){if(a<=0.001)return '';return `<div class="abs" style="left:0;width:1080px;top:232px;text-align:center;opacity:${a.toFixed(3)};font:700 146px/1.0 Poppins;letter-spacing:-3px;color:#FFFFFF;-webkit-text-stroke:22px #0A1430;paint-order:stroke fill;text-shadow:0 10px 0 rgba(0,0,0,.35)">NYAMUK PILIH<br><span style="color:${C.LIMAU}">KAMU?</span></div>`}
function vinyetMalam(){return svgW(1080,1920,`<defs><radialGradient id="svn" cx=".5" cy=".55" r=".8"><stop offset=".55" stop-color="#050B1E" stop-opacity="0"/><stop offset="1" stop-color="#050B1E" stop-opacity=".6"/></radialGradient></defs><rect width="1080" height="1920" fill="url(#svn)"/>`)}

// ===== BABAK 1+2: hook teras → kejutan "bukan sial, nyamuk milih: napas lalu bau kulit" (satu dunia, kamera bergerak) =====
const kNyamuk=KI(4).m,kKaki=KI(6).m,kBentol=KI(7).m,kTeman=KI(8).m,kSantai=KI(9).m,kKenapa=KI(11).m,kItu=KI(16).m,kSial=KI(18).m,kMilih=KI(21).m,
 kBiasa=KI(22).m,kJauh=KI(24).m,kNapas=KI(26).m,kLalu=KI(27).m,kDekat=KI(29).m,kBau=KI(30).m,kKulit=KI(31).m,B3=cel(32);
const AT1=tebeAnimasi([{t:0,pose:'netral'},{t:kTeman+.05,pose:'curiga',transisi:.35},{t:kKenapa-.05,pose:'bingung',transisi:.35},{t:kItu,pose:'kaget',transisi:.25},
 {t:kSial+.5,pose:'penasaran',transisi:.35},{t:kBiasa,pose:'netral',transisi:.4},{t:kBau-.1,pose:'curiga',transisi:.35}],{benih:1});
function setB12(T){
 const s0=stSampul(T);
 const st=Object.assign({},s0);
 st.judul=1-halus(lin(T,1.0,1.3));st.panah=1-halus(lin(T,1.0,1.3));
 // Tebe: menepuk sampai "bentol-bentol" selesai, lalu menoleh ke teman, ke kamera, dst.
 const tepK=1-halus(lin(T,kTeman-.1,kTeman+.3));
 let tb=tepuk(AT1(T),T,tepK);
 if(T>kTeman-.1&&T<kKenapa+.2)tb.lihatX=lerp(tb.lihatX,5,halus(lin(T,kTeman,kTeman+.3))*(1-halus(lin(T,kKenapa-.1,kKenapa+.2))));
 if(T>kBau-.1){tb.lihatY=lerp(tb.lihatY||0,5,halus(lin(T,kBau-.1,kBau+.3)));tb.kepalaMiring=lerp(tb.kepalaMiring,-9,halus(lin(T,kBau-.1,kBau+.3)))}
 // napas: mulut sedikit terbuka saat pita keluar
 tb.mulutBuka=lerp(tb.mulutBuka,.35,puls(T,kJauh-.1,1.2));
 st.tebe=tb;
 st.bentol=3+3*cl(lin(T,kBentol,kBentol+.95));
 st.blurTeman=jalur(T,{b:5},[[kTeman,kTeman+.4,{b:.6}],[kKenapa-.25,kKenapa+.2,{b:5}]]).b;
 // dua nyamuk kecil masuk dari taman pada "NYAMUK datang", lalu mengitari Tebe
 const msk=halus(lin(T,kNyamuk-.15,kNyamuk+.9));
 st.kecil=[0,1].map(i=>{const a=T*(1.3+i*.4)+i*2.4,ox=[360,560][i]+Math.cos(a)*70,oy=[960,1180][i]+Math.sin(a*1.3)*40;
  return {x:lerp([1500,1400][i],ox,msk),y:lerp([520,820][i],oy,msk),s:.42+.06*i,arah:-1,a:cl(msk*3)*(1-halus(lin(T,kJauh,kJauh+.4))),b:i+4}});
 // nyamuk besar: tepis awan "sial" → kacamata memilih → ngebut ke kejauhan → selancar pita napas → ikuti titik bau ke betis
 const bigBase=jalur(T,{x:690,y:930,ar:-1,kp:-4},[[kItu-.1,kSial+.05,{x:450,y:720}],[kSial+.35,kMilih-.1,{x:630,y:900,kp:0}],
  [kBiasa-.05,kBiasa+.45,{x:1720,y:740,ar:1}],[kBiasa+.55,kBiasa+.75,{ar:-1}]]);
 let bx=bigBase.x,by=bigBase.y;
 const ride=lin(T,kJauh,kLalu+.1);
 if(ride>0){const p=N.pita.titik(RUTE,1-.72*ioS(ride));bx=p[0];by=p[1]-60}
 const turun=jalur(T,{x:0,y:0},[[kLalu+.1,kDekat+.5,{x:620,y:1170}],[kBau,kKulit+.7,{x:BETIS[0]+120,y:BETIS[1]-120}]]);
 if(T>kLalu+.1){const k=halus(lin(T,kLalu+.1,kLalu+.4));bx=lerp(bx,turun.x,k);by=lerp(by,turun.y,k)}
 const scan=halus(lin(T,kMilih,kMilih+.25))*(1-halus(lin(T,kBiasa-.2,kBiasa)));
 st.big={x:bx+Math.sin(T*1.3)*10,y:by+Math.sin(T*2.2)*10,s:lerp(1.7,1.0,halus(lin(T,kItu-.1,kSial+.05))),arah:bigBase.ar,
  ekspresi:T<kItu?'seringai':(T<kBau?'biasa':'senang'),kacamata:scan,kepala:bigBase.kp+scan*Math.sin((T-kMilih)*5)*16,glow:1-halus(lin(T,kItu-.2,kItu+.2))+.6*halus(lin(T,kBau,kBau+.4)),a:1,lihat:[scan*Math.sin((T-kMilih)*5)*5,0]};
 // awan sial muncul di atas kepala Tebe lalu ditepis kaki nyamuk
 const aw=halus(lin(T,kItu-.1,kItu+.25)),fl=ioS(lin(T,kSial+.12,kSial+.65));
 st.awan=aw>0&&fl<1?{x:lerp(330,-260,fl),y:lerp(680,300,fl),rot:fl*-70,a:aw*(1-fl)}:null;
 // pita napas & titik bau kulit (urutan = urutan kata)
 st.pita={k:ioS(lin(T,kBiasa+.2,kJauh+.55)),a:halus(lin(T,kBiasa+.2,kBiasa+.5))*(1-halus(lin(T,kLalu,kDekat+.2)))};
 st.bau=halus(lin(T,kBau-.25,kBau+.25));
 st.cam=jalur(T,{cx:540,cy:960,z:1},[[0,1.0,{z:1.012},LIN],[1.0,1.9,{cy:1090,z:1.03}],[1.9,kTeman,{z:1.05},LIN],[kTeman,kTeman+.45,{cx:830,cy:1080,z:1.1}],[kKenapa-.2,kKenapa+.3,{cx:440,cy:1110,z:1.14}],
  [kItu-.1,kItu+.5,{cx:480,cy:1080,z:1.06}],[kMilih-.2,kMilih+.4,{cx:600,cy:1080,z:1.03}],[kBiasa,kBiasa+.75,{cx:960,cy:900,z:.62}],
  [kLalu,kDekat+.9,{cx:420,cy:1230,z:1.2}],[kDekat+.9,B3+.3,{z:1.3},LIN]]);
 return teras(T,st)}

// ===== BABAK 3: bangku panjang — 4 pasang kaki, pola titik bau berbeda; "kabar BURUK" bohlam berkedip, nyamuk menoleh menyeringai =====
const kBeda=KI(36).m,kKorban=KI(39).m,kKabar=KI(41).m,kBuruk=KI(42).m,B4=cel(43);
const KAKI=[[300,{kulit:C.KUL,celana:C.TEAL2,sarung:1},C.LIMAU,'bulat'],[800,{kulit:C.KULT,kulitG:'#8E5B3E',celana:C.DONGKER3},'#7FE6D2','cincin'],
 [1300,{kulit:'#F0C8A0',celana:'#C9A24A'},'#FFE58A','bintang'],[1800,{kulit:C.KULD,kulitG:'#6E432C',celana:'#5C7BB8'},'#A9DAFF','campur']];
function setB3(T){const u=T-B3;
 let s=N.terasMalam(-600,-800,3600,3400,T,{lantai:1335,dindingX:-600,dindingW:3600,atap:0});
 // jendela-jendela rumah di dinding
 for(let i=0;i<4;i++){const x=150+i*560;s+=`<rect x="${x}" y="420" width="300" height="360" rx="14" fill="#16294F"/><rect x="${x+12}" y="432" width="276" height="336" rx="8" fill="#203A6E"/><rect x="${x+144}" y="432" width="12" height="336" fill="#16294F"/>`}
 s+=N.bohlam(1580,560,1,T,{tali:620,kedip:kedip(T,kKabar-.25)+kedip(T,kBuruk+.02)});
 // bangku panjang
 s+=`<rect x="0" y="905" width="2100" height="40" rx="14" fill="#7A5A3E"/><rect x="0" y="940" width="2100" height="14" fill="#5E432C"/>${[60,700,1400,2040].map(x=>`<rect x="${x}" y="950" width="24" height="390" fill="#5E432C"/>`).join('')}`;
 KAKI.forEach(([x,o,w,pola],i)=>{s+=N.kakiDuduk(x,1335,.92,o);
  const a=halus(lin(T,B3+.15+i*.42,B3+.6+i*.42));
  s+=N.titikBau(x-50,1000,T+i,{a,warna:w,pola,n:14,tinggi:480,lebar:60,r:17,laju:.4+.05*i})+N.titikBau(x+60,1000,T+i+.5,{a:a*.85,warna:w,pola,n:10,tinggi:420,lebar:50,r:14,laju:.38+.05*i})});
 // nyamuk besar menunggu di atas, menoleh ke kamera saat "BURUK"
 const tol=halus(lin(T,kBuruk-.1,kBuruk+.3));
 const mx=1180+lin(T,B3,B4)*240+Math.sin(T*1.3)*12, my=640+Math.sin(T*2.2)*10;
 s+=N.nyamuk(mx,my,1.1,T,{arah:lerp(1,-1,halus(lin(T,B3,B3+.01))) ,ekspresi:tol>.5?'seringai':'biasa',kepala:-12*tol,lihat:[-6*tol,6*tol],glow:.5});
 const cx=lerp(330,1460,ioS(lin(T,B3,kKorban)))+u*4, z=1.12+.03*Math.sin(u*.8)+.08*tol, cy=930-40*tol;
 // gelap sebentar saat bohlam berkedip
 const gelap=.28*(kedip(T,kKabar-.25)+kedip(T,kBuruk+.02));
 return latar(C.LANGIT)+kamera(svgBesar(s),cx,cy,z)+`<div class="abs" style="inset:0;background:#030816;opacity:${gelap.toFixed(3)}"></div>`}

// ===== BABAK 4-6: LAB GENERIK — lengan relawan + sarung nilon → "prasmanan" nyamuk → rebutan vs kurang laku → zat asam → dikaitkan "?" → satu nilon dicuekin =====
const kStudi=KI(44).m,kRelawan=KI(47).m,kPakai=KI(48).m,kNilon=KI(49).m,kLengan=KI(51).m,kNilonnya=KI(52).m,kSodor=KI(53).m,kKenyamuk=KI(55).m,kPras=KI(57).m,
 kRebut=KI(61).m,kKurang=KI(64).m,kLaku=KI(65).m,kSi=KI(66).m,kMagnet=KI(67).m,kZat=KI(69).m,kAsam=KI(70).m,kTertentu=KI(71).m,kKulit2=KI(73).m,kBanyak=KI(76).m,
 kIni=KI(77).m,kDikait=KI(79).m,kBelum=KI(80).m,kPenyebab=KI(82).m,kAdaSatu=KI(84).m,kZatnya=KI(86).m,kTinggi=KI(87).m,kTapi=KI(88).m,kCuek=KI(90).m,B7=cel(91);
const B5=cel(58),B6=cel(77);
const LENGAN=[[1720,{kulit:C.KUL,kulitG:C.KULG}],[1905,{kulit:C.KULD,kulitG:'#6E432C'}],[2090,{kulit:'#F0C8A0',kulitG:'#D9A27A'}],[2275,{kulit:C.KULT,kulitG:'#8E5B3E'}]];
const NIL=[[170,'#2FB3A5'],[390,C.MUSTARD],[610,'#FFFFFF'],[830,'#7FB7E0']];   // tag warna polos (tanpa huruf); #2 mustard = milik Tebe
const SWARM=[0,1,2,3,4,5,6];
const AT5=tebeAnimasi([{t:0,pose:'penasaran'},{t:kKulit2-.15,pose:'kaget',tanda:'!',transisi:.25},{t:kBanyak+.1,pose:'bingung',tanda:'!',transisi:.35}],{benih:5});
function setLab(T){
 let bg=N.labLatar(-1000,-800,3600,3400,T,{meja:1250,jendela:[1300,200,360,320],rakX:1720,rakY:560});
 // kandang kasa besar = arena pilihan
 let ar=N.kotakBening(500,830,1,{w:900,h:780});
 ar+=`<rect x="80" y="110" width="840" height="14" rx="7" fill="${C.LOGAM}"/>`;
 const kilau3=halus(lin(T,kZatnya-.2,kTinggi+.2));
 NIL.forEach(([x,tag],i)=>{const tt=i===1?halus(lin(T,kAsam-.3,kTertentu+.2)):(i===2?.25+.75*kilau3:.25);
  ar+=N.nilonGantung(x,160,1,T,{benih:i,tag,tetes:tt,nTetes:i===1?24:(i===2?22:5),kilau:i===1?halus(lin(T,kAsam-.3,kAsam+.3)):(i===2?kilau3:0)})});
 // nyamuk: antre bawa piring → memilih → rebutan di nilon #2
 let mq='';
 const antre=halus(lin(T,kSodor-.3,kKenyamuk+.3)), rebut=ioS(lin(T,kRebut-.35,kRebut+.35));
 SWARM.forEach(i=>{
  const qx=880-i*118, qy=(i%2?690:600)+Math.sin(T*3+i)*8;   // antrean dua baris
  const pilih=halus(lin(T,kPras-.1+i*.05,kPras+.3+i*.05));
  const ang=i/7*Math.PI*2+T*.9, rx=390+Math.cos(ang)*(95+(i%3)*28), ry=330+Math.sin(ang)*(140+(i%2)*30)+Math.sin(T*6+i)*6;
  const x=lerp(lerp(1000+i*40,qx,antre),rx,rebut), y=lerp(lerp(qy,qy-60*Math.sin(Math.PI*pilih),pilih),ry,rebut), muncul=halus(lin(T,kNilonnya-.3+i*.06,kSodor+i*.06));
  if(muncul<=0)return;
  const arah=rebut>.5?(Math.cos(ang)>0?-1:1):-1;
  mq+=`<g opacity="${muncul.toFixed(3)}">`+N.nyamuk(x,y,.58,T,{arah:lerp(-1,arah,halus(lin(T,kRebut+.2,kRebut+.4))),piring:1-halus(lin(T,kMagnet,kMagnet+.4)),benih:i,kepala:pilih*(1-rebut)*-20,ekspresi:rebut>.5?'senang':'biasa'})+`</g>`});
 // nyamuk menguap lewat di nilon #4 ("kurang laku" — tetap ada 1 nyamuk, bukan nol)
 const lw=lin(T,kKurang-.5,kSi+.3);
 if(lw>0&&lw<1)mq+=N.nyamuk(lerp(1050,640,lw),420+Math.sin(T*2)*12,.5,T,{arah:-1,ekspresi:'menguap',benih:9});
 // nyamuk cuek melewati nilon #3 yang berkilau
 const ck=lin(T,kTapi-.3,B7+.4);
 if(ck>0&&ck<1)mq+=N.nyamuk(lerp(470,800,ck),300-Math.sin(Math.PI*ck)*60,.62,T,{arah:1,ekspresi:'cuek',kepala:-26,benih:11});
 // ikon magnet + label + garis putus-putus "dikaitkan" dengan "?"
 const mg=oBack(lin(T,kMagnet-.05,kMagnet+.35));
 let ik='';
 if(mg>0)ik+=N.ikonMagnet(390,-40,.75*mg+.01,Math.sin(T*2)*5,cl(mg*2));
 const gr=ioS(lin(T,kDikait-.3,kDikait+.4));
 if(gr>0){const A=[440,300],B=[440,70],Cc=[560,180];let d='';const n=Math.max(2,Math.round(30*gr));
  for(let i=0;i<=n;i++){const q=i/30,x=(1-q)*(1-q)*A[0]+2*q*(1-q)*Cc[0]+q*q*B[0],y=(1-q)*(1-q)*A[1]+2*q*(1-q)*Cc[1]+q*q*B[1];d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}
  ik+=`<path d="${d}" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-dasharray="18 16" stroke-dashoffset="${(-T*40).toFixed(1)}" stroke-linecap="round" opacity=".9"/>`;
  const q=halus(lin(T,kDikait+.2,kDikait+.5)),sw=Math.sin((T-kDikait)*3)*12;
  ik+=`<g transform="rotate(${sw.toFixed(1)} 540 180)">${N.tanya(548,290,1.0,q)}</g>`}
 // lengan relawan (sisi kanan dunia) masuk dari bawah meja lalu memakai sarung nilon dari arah tangan
 let lg='';
 LENGAN.forEach(([x,o],i)=>{const m=ioS(lin(T,kStudi+i*.18,kStudi+.6+i*.18)),nl=ioS(lin(T,kPakai-.1+i*.12,kNilon+.2+i*.12));
  lg+=`<g transform="translate(0 ${((1-m)*520).toFixed(1)})">${N.lengan(x,1290,.86,T,Object.assign({rot:-90,panjang:420,nilon:nl,dariTangan:1},o))}</g>`});
 const depan=`<rect x="1500" y="1250" width="1100" height="1400" fill="${C.MEJA2}"/><rect x="1500" y="1250" width="1100" height="70" fill="${C.MEJA}"/><rect x="1500" y="1320" width="1100" height="10" fill="#8FB1A8"/>`;
 // kamera: lengan → naik & geser ke arena (prasmanan) → rebutan → kurang laku → magnet → zoom tetes → garis "?" → satu nilon berkilau
 const cam=jalur(T,{cx:2000,cy:1000,z:1.0},[[B4,kNilon,{z:1.06},LIN],[kNilonnya-.15,kKenyamuk,{cx:520,cy:470,z:1.18}],[kKenyamuk,B5,{z:1.24},LIN],
  [kRebut-.4,kRebut+.2,{cx:420,cy:400,z:1.25}],[kKurang-.3,kKurang+.3,{cx:760,cy:440,z:1.2}],[kSi-.1,kMagnet+.3,{cx:540,cy:400,z:1.08}],
  [kZat-.2,kAsam+.3,{cx:560,cy:320,z:1.32}],[kAsam+.3,B6,{z:1.38},LIN],[kIni-.1,kDikait+.2,{cx:470,cy:280,z:1.28}],
  [kAdaSatu-.2,kAdaSatu+.4,{cx:620,cy:330,z:1.5}],[kAdaSatu+.4,B7+.3,{z:1.56},LIN]]);
 let h=latar(C.LAB)+kamera(svgBesar(bg)+svgW(1080,1920,ar+mq+ik+lg+depan),cam.cx,cam.cy,cam.z);
 // Tebe mengintip dari kanan bawah (ruang layar, zona aman): label mustard = nilon miliknya, jambul ? → !
 const ip=halus(lin(T,kTertentu-.1,kTertentu+.4))*(1-halus(lin(T,B6-.35,B6+.1)));
 if(ip>0){const tb=AT5(T);tb.lihatX=-4;tb.lihatY=-4;h+=`<div class="abs" style="left:600px;top:${(1480-ip*470).toFixed(1)}px">${KS.tebe(tb,290)}</div>`}
 // label kecil "SI MAGNET" di bawah ikon (ruang layar mengikuti kamera)
 const lb=halus(lin(T,kMagnet,kMagnet+.3))*(1-halus(lin(T,kZat-.3,kZat)));
 if(lb>0){const sx=(390-cam.cx)*cam.z+540,sy=(56-cam.cy)*cam.z+960;h+=`<div class="abs" style="left:${(sx-150).toFixed(1)}px;width:300px;top:${sy.toFixed(1)}px;text-align:center;opacity:${lb.toFixed(3)}"><span style="display:inline-block;padding:4px 18px 6px;border-radius:14px;background:${C.MERAH};color:#FFFFFF;font:700 34px Poppins;letter-spacing:2px">SI MAGNET</span></div>`}
 return h}

// ===== BABAK 7: meja dekat — lengan nilon Tebe dikerubuti, lengan polos sepi; kadar TETAP tinggi; kalender membalik, siang-malam, tanaman tumbuh, sarang laba-laba; magnet "klang" =====
const kNah=KI(91).m,kKadar=KI(94).m,kTetap=KI(97).m,kTinggi2=KI(98).m,kLebih=KI(99).m,kSetahun=KI(101).m,kSatuM=KI(102).m,kDipantau=KI(104).m,kTahun=KI(106).m,kTetap2=KI(107).m,kMagnet2=KI(108).m,B8=cel(109);
const AT7=tebeAnimasi([{t:0,pose:'curiga'},{t:kTetap,pose:'kaget',transisi:.3},{t:kSatuM,pose:'sedih',transisi:.4},{t:kMagnet2-.05,pose:'tertawa',transisi:.2}],{benih:7});
function balikKal(T){return 3*halus(lin(T,kLebih,kSetahun+.4))+lin(T,kSetahun+.4,kDipantau)*1.5+Math.max(0,Math.min(T,kMagnet2)-kDipantau)*7.5}
function setB7(T){const u=T-B7;
 const waktuLalu=lin(T,kDipantau-.1,kTetap2);
 let s=N.labLatar(-1000,-800,3600,3400,T,{meja:1250,jendela:[620,330,300,260],rak:false});
 s+=N.kalenderKosong(250,560,1.05,balikKal(T));
 s+=N.sarang(-6,330,1.5,halus(waktuLalu));
 s+=N.tanaman(800,1262,1,halus(waktuLalu));
 // lengan polos (orang lain) dari kanan, sepi
 s+=N.lengan(1180,1196,.9,T,{rot:180,panjang:440,kulit:C.KULD,kulitG:'#6E432C',nilon:1,tetes:.3,nTetes:4,benih:3});
 // lengan Tebe (manset hoodie mustard) dikerubuti
 s+=N.lengan(290,1100,1.12,T,{panjang:420,nilon:1,manset:C.MUSTARD,tetes:1,nTetes:20,benih:2});
 // meteran tetes hijau di samping lengan: tetap penuh (tanpa angka)
 const mt=halus(lin(T,kKadar-.2,kKadar+.3));
 if(mt>0)s+=`<g opacity="${mt.toFixed(3)}">${N.meteran(720,1010,.62,.9+.1*halus(lin(T,kTetap-.1,kTinggi2+.2)),T)}</g>`;
 let mq='';
 for(let i=0;i<6;i++){const ang=i/6*Math.PI*2+T*1.1,x=560+Math.cos(ang)*(210+(i%2)*40),y=990+Math.sin(ang)*70+Math.sin(T*5+i)*6;mq+=N.nyamuk(x,y,.48,T,{arah:Math.cos(ang)>0?-1:1,ekspresi:'senang',benih:i})}
 const lw=lin(T,kSetahun-.6,kSatuM+.6);if(lw>0&&lw<1)mq+=N.nyamuk(lerp(1100,700,lw),1300-Math.sin(Math.PI*lw)*60,.44,T,{arah:-1,ekspresi:'menguap',benih:8});
 // magnet jatuh "klang" ke lengan Tebe
 const jt=lin(T,kTetap2-.15,kMagnet2+.05),jatuh=jt*jt;
 if(jt>0)mq+=N.ikonMagnet(560,lerp(-300,980,jatuh),1.15,-8+8*jatuh,1);
 // Tebe di balik meja (kiri), tepuk jidat tertawa pasrah
 const tb=AT7(T);const tj=halus(lin(T,kMagnet2-.05,kMagnet2+.2));
 if(tj>0){tb.tanganK=[lerp(tb.tanganK[0],196,tj),lerp(tb.tanganK[1],150,tj)];tb.bentukK='buka';tb.tekukK=1;tb.mataSenyum=lerp(tb.mataSenyum||0,1,tj)}
 const tebeHtml=`<div class="abs" style="left:-20px;top:${(800+Math.sin(T*1.6)*3).toFixed(1)}px">${KS.tebe(tb,430)}</div>`;
 const depan=`<rect x="-1000" y="1250" width="3600" height="1400" fill="${C.MEJA2}"/><rect x="-1000" y="1250" width="3600" height="70" fill="${C.MEJA}"/><rect x="-1000" y="1320" width="3600" height="10" fill="#8FB1A8"/>`;
 // siang–malam menyapu meja saat waktu berlalu
 const fs=(Math.max(0,T-kDipantau)*.85)%1, envS=halus(lin(T,kDipantau,kDipantau+.3))*(1-halus(lin(T,kTetap2-.35,kTetap2))), sapu=envS*halus(lin(fs,0,.45))*(1-halus(lin(fs,.5,1)));
 const goyang=Math.exp(-Math.max(0,T-kMagnet2)*7)*Math.sin(Math.max(0,T-kMagnet2)*40)*(T>kMagnet2?14:0);
 const z=1.0+.03*ioS(lin(u,0,2))+.05*halus(lin(T,kTetap2-.2,kMagnet2+.2)), cy=1000+goyang;
 return latar(C.LAB)+kamera(svgBesar(s)+tebeHtml+svgW(1080,1920,depan+mq),540,cy,z)
  +`<div class="abs" style="inset:0;background:${C.DONGKER};opacity:${(sapu*.16).toFixed(3)}"></div>`+`<div class="abs" style="inset:0;background:#FFF3C4;opacity:${((envS-sapu)*.1).toFixed(3)}"></div>`}

// ===== BABAK 8: kembali ke teras — lencana KAMU / DIA, Tebe menandai teman, menepuk kursi kosong → kamera mendarat di sampul (loop) =====
const kDi=KI(109).m,kKamu=KI(113).m,kDia=KI(115).m,kKomen=KI(116).m,kTag=KI(119).m,kDia2=KI(120).m,kAjak=KI(121).m,kDuduk=KI(122).m,kTeras=KI(125).m,kLagi=KI(126).m;
const AT8=tebeAnimasi([{t:0,pose:'menjelaskan'},{t:kKamu-.1,pose:'tertawa',transisi:.3},{t:kKomen,pose:'semangat',transisi:.3},{t:kTag-.1,pose:'netral',transisi:.3},{t:kAjak,pose:'melambai',transisi:.3}],{benih:8});
function setB8(T){
 const sA=stSampul(T-D()), k=halus(lin(T,kTeras-.45,D()-.08));
 let tb=AT8(T);
 // HP di tangan kanan untuk "Tag dia"
 const hA=halus(lin(T,kTag-.25,kTag+.1))*(1-halus(lin(T,kAjak-.15,kAjak+.15)));
 let tangan='';
 if(hA>0){tb.tanganN=[lerp(tb.tanganN[0],268,hA),lerp(tb.tanganN[1],292,hA)];tb.bentukN='kepal';tb.tekukN=1;tb.lihatX=lerp(tb.lihatX||0,4,hA);
  tangan=`<g opacity="${hA.toFixed(3)}">${N.hp(tb.tanganN[0],tb.tanganN[1]-50,1,-8)}</g>`}
 // menepuk kursi kosong (tangan kanan ke arah kursi)
 const pt=halus(lin(T,kAjak,kDuduk+.2))*(1-k);
 if(pt>0){const ay=Math.abs(Math.sin((T-kAjak)*Math.PI*2.4))*30;tb.tanganN=[lerp(tb.tanganN[0],356,pt),lerp(tb.tanganN[1],300+ay,pt)];tb.bentukN='buka';tb.tekukN=1}
 tb=campur(tb,sA.tebe,k);
 const st=Object.assign({},sA);
 st.tebe=tb;st.tangan=k<.5?tangan:'';
 st.bentol=3;
 st.blurTeman=lerp(.8,5,k);st.teman=T>kTag+.3?'nyengir':'senang';
 st.lencana=[halus(lin(T,kKamu-.1,kKamu+.35))*(1-halus(lin(T,kTag-.2,kTag+.2))),halus(lin(T,kDia-.1,kDia+.35))*(1-halus(lin(T,kTag-.2,kTag+.2)))];
 st.pesawat=T>kTag+.1&&T<kAjak+.4?lin(T,kTag+.1,kAjak+.4):-1;
 // nyamuk besar kembali masuk dari kanan atas ke posisi sampul
 const mb=sA.big, masuk=ioS(lin(T,kTeras-.6,D()-.1));
 st.big=Object.assign({},mb,{x:lerp(1500,mb.x,masuk),y:lerp(560,mb.y,masuk),a:cl(masuk*4),glow:mb.glow*masuk});
 st.kecil=[];
 st.judul=halus(lin(T,D()-.75,D()-.4));st.panah=st.judul;
 const c0={cx:700,cy:1080,z:.97};
 st.cam={cx:lerp(c0.cx+Math.sin(T*.4)*8,540,k),cy:lerp(c0.cy,960,k),z:lerp(c0.z+.01*(T-B8),1,k)};
 return teras(T,st)}

// ---------- komposisi ----------
const BABAK=[{a:0,f:setB12},{a:B3,f:setB3,tr:'geser',d:.5},{a:B4,f:setLab,tr:'dorong',d:.5},{a:B7,f:setB7,tr:'dorong',d:.5},{a:B8,f:setB8,tr:'geser',d:.5}];
const GRUP=KS.teks(W,{ganti:{'disodorin':'disodorin','tongkronganmu':'tongkronganmu'},
 tekan:['nyamuk','santai','kamu?','sial.','milih.','napasmu,','kulitmu.','beda.','buruk.','nilon','prasmanan.','rebutan,','magnet','asam','dikaitkan,','satu','cuek.','tetap','setahun.','magnet.','kamu','dia?','tag','lagi.'],maks:3});
function posSub(T){if(T>B8)return 1330;return 1350}
function teksBesar(T){return cap(`KENAPA NYAMUK GIGIT ${L("KAMU?")}`,T,kKenapa-.05,kItu-.05,{uk:72})
 +cap('BUKAN SIAL',T,kSial-.1,kMilih-.15,{uk:84,warna:'#FFFFFF'})+cap(`NYAMUK ITU ${L('MILIH')}`,T,kMilih-.05,kBiasa+.6,{uk:84})
 +cap(`DARI JAUH: <span style="color:${C.KABUT}">NAPAS</span>`,T,kNapas-.15,kLalu+.15,{uk:64,warna:C.KABUT})+cap(`DARI DEKAT: ${L('BAU KULIT')}`,T,kBau-.1,B3-.05,{uk:64})
 +cap(`BAU KULIT ${L('BEDA')}`,T,kBeda-.05,kKorban-.1,{uk:80})+cap('KABAR BURUK…',T,kBuruk-.05,B4-.05,{uk:84,warna:C.MERAH})
 +cap(`1 STUDI: ${L('NILON')}`,T,kNilon-.05,kNilonnya+.4,{uk:80})+cap('PRASMANAN',T,kPras-.05,B5-.1,{uk:88,rot:2})
 +cap('REBUTAN',T,kRebut-.05,kKurang-.2,{uk:90,warna:C.MERAH})+cap('KURANG LAKU',T,kKurang-.05,kSi-.1,{uk:80,warna:'#FFFFFF'})
 +cap(`ZAT ASAM ${L('TERTENTU')}`,T,kAsam-.05,B6-.1,{uk:76})
 +cap(`BARU ${L('DIKAITKAN')}`,T,kDikait-.05,kAdaSatu-.15,{uk:80})+cap(`NYAMUKNYA ${L('CUEK')}`,T,kCuek-.1,B7+.1,{uk:80,rot:2})
 +cap(`KADARNYA ${L('TETAP TINGGI')}`,T,kTetap-.05,kSatuM-.1,{uk:62})
 +capMagnet(T)
 +cap(`${L('KAMU')} ATAU DIA?`,T,kKamu-.1,kKomen-.1,{uk:88})+cap('KOMEN 1 KATA',T,kKomen-.05,kTag-.1,{uk:84,rot:2})+cap('TAG DIA',T,kTag-.05,kAjak+.2,{uk:84,warna:'#FFFFFF',rot:-3})}
function capMagnet(T){const a=kMagnet2-.05,b=B8+.15,kk=halus(lin(T,a,a+.18))*(1-halus(lin(T,b-.2,b)));if(kk<=0)return '';
 const s=1+.25*(1-oBack(lin(T,a,a+.3)));
 return `<div class="abs" style="left:0;width:1080px;top:250px;text-align:center;opacity:${kk.toFixed(3)};transform:scale(${s.toFixed(3)}) rotate(-3deg);font:700 138px/1.0 Poppins;letter-spacing:-3px;color:#FFFFFF;-webkit-text-stroke:20px #0A1430;paint-order:stroke fill;text-shadow:0 10px 0 rgba(0,0,0,.35)">TETAP<br><span style="color:${C.MERAH}">MAGNET</span></div>`}
window.EFEK=[{t:0.0,sfx:'nging',vol:.32},{t:2.68,sfx:'tepuk',vol:.35},{t:B3-.3,sfx:'whoosh',vol:.25},{t:kMagnet-.02,sfx:'pop',vol:.3},
 {t:kMagnet2-.02,sfx:'klang',vol:.38},{t:+(AKHIR+0.72-1.2).toFixed(2),sfx:'nging_akhir',vol:.28}];

window.render=function(T){
 let h=KS.komposisi(T,BABAK);
 h+=vinyetMalam()+KS.vinyet(T,.12);
 const isi=T>1.2&&T<D()-.62;
 let lap='';
 if(T<1.6||T>D()-1)lap+=judulSampul(T<1.6?1-halus(lin(T,1.0,1.3)):halus(lin(T,D()-.75,D()-.4)));
 if(isi){lap+=teksBesar(T)+KS.teksLayar(T,GRUP,{y:posSub(T),ukuran:68});}
 lap+=KS.watermark(T,(T>1.6&&T<B8+1)?1:0);
 lap+=KS.logoYT(T,D()-1.05,D()-.05,{y:1452,x:540,uk:38});
 h+=`<div class="abs" style="inset:0">${lap}</div>`;
 document.getElementById('V').innerHTML=h;
};
window.render(0);
</script></body></html>
